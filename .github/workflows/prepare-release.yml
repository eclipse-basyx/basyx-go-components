name: Prepare Release Changelog

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release tag in vX.Y.Z SemVer format
        required: true
        type: string
      create_pull_request:
        description: Push a release branch and open a pull request
        required: true
        default: false
        type: boolean

concurrency:
  group: prepare-release-${{ inputs.version }}
  cancel-in-progress: false

permissions: {}

jobs:
  prepare:
    name: Prepare changelog artifact
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: true

      - name: Prepare versioned changelog
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          go run ./cmd/changelogrelease prepare \
            --version "${RELEASE_VERSION}" \
            --changelog CHANGELOG.md \
            --output prepared/CHANGELOG.md

          diff_status=0
          git diff --no-index --no-ext-diff -- CHANGELOG.md prepared/CHANGELOG.md > prepared/CHANGELOG.diff || diff_status=$?
          if [ "${diff_status}" -gt 1 ]; then
            echo "::error title=CHLOG-WORKFLOW-GENDIFF::Failed to generate the changelog preview."
            exit "${diff_status}"
          fi

          {
            echo "## Prepared ${RELEASE_VERSION} changelog"
            echo
            echo '```diff'
            cat prepared/CHANGELOG.diff
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload changelog preview
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: prepared-changelog-${{ github.run_id }}
          path: |
            prepared/CHANGELOG.md
            prepared/CHANGELOG.diff
          if-no-files-found: error
          retention-days: 7

  create-pull-request:
    name: Create release preparation pull request
    needs: prepare
    if: ${{ inputs.create_pull_request }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Download prepared changelog
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: prepared-changelog-${{ github.run_id }}
          path: prepared

      - name: Commit prepared changelog
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          branch="release/prepare-${RELEASE_VERSION}"

          if git ls-remote --exit-code --heads origin "${branch}" >/dev/null 2>&1; then
            echo "::error title=CHLOG-WORKFLOW-CHECKBRANCH::Remote branch ${branch} already exists."
            exit 1
          fi

          cp prepared/CHANGELOG.md CHANGELOG.md
          if git diff --quiet -- CHANGELOG.md; then
            echo "::error title=CHLOG-WORKFLOW-VALIDATECHANGE::Prepared changelog contains no changes."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --create "${branch}"
          git add CHANGELOG.md
          git commit --message "Prepare ${RELEASE_VERSION} changelog"
          git push origin "HEAD:refs/heads/${branch}"

      - name: Open release preparation pull request
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          branch="release/prepare-${RELEASE_VERSION}"
          gh pr create \
            --base "${DEFAULT_BRANCH}" \
            --head "${branch}" \
            --title "Prepare ${RELEASE_VERSION} changelog" \
            --body "Versions the current Unreleased changelog section for ${RELEASE_VERSION} and starts the next Unreleased section. Merge this pull request before creating and publishing the release tag."
