name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release tag in vX.Y.Z SemVer format
        required: true
        type: string
  pull_request:
    types: [closed]

concurrency:
  group: release-${{ inputs.version || github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

permissions: {}

jobs:
  prepare:
    name: Create release pull request
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
      contents: write
      pull-requests: write
    steps:
      - name: Checkout default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: true

      - name: Prepare and validate versioned changelog
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          branch="release/prepare-${RELEASE_VERSION}"

          if git ls-remote --exit-code --heads origin "${branch}" >/dev/null 2>&1; then
            echo "::error title=CHLOG-WORKFLOW-CHECKBRANCH::Remote branch ${branch} already exists."
            exit 1
          fi

          go test -count=1 ./internal/changelogrelease ./cmd/changelogrelease
          go run ./cmd/changelogrelease prepare \
            --version "${RELEASE_VERSION}" \
            --changelog CHANGELOG.md \
            --output prepared/CHANGELOG.md

          diff_status=0
          git diff --no-index --no-ext-diff -- CHANGELOG.md prepared/CHANGELOG.md > prepared/CHANGELOG.diff || diff_status=$?
          if [ "${diff_status}" -gt 1 ]; then
            echo "::error title=CHLOG-WORKFLOW-GENDIFF::Failed to generate the changelog preview."
            exit "${diff_status}"
          fi

          cp prepared/CHANGELOG.md CHANGELOG.md
          go run ./cmd/changelogrelease validate --changelog CHANGELOG.md
          if git diff --quiet -- CHANGELOG.md; then
            echo "::error title=CHLOG-WORKFLOW-VALIDATECHANGE::Prepared changelog contains no changes."
            exit 1
          fi

          {
            echo "## Release ${RELEASE_VERSION}"
            echo
            echo "A pull request will be opened. Merging it publishes the GitHub release and starts the Docker release build."
            echo
            echo '```diff'
            cat prepared/CHANGELOG.diff
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --create "${branch}"
          git add CHANGELOG.md
          git commit --message "Prepare ${RELEASE_VERSION} changelog"
          git push origin "HEAD:refs/heads/${branch}"

      - name: Open release pull request
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          branch="release/prepare-${RELEASE_VERSION}"
          pr_url=$(gh pr create \
            --base "${DEFAULT_BRANCH}" \
            --head "${branch}" \
            --title "Release ${RELEASE_VERSION}" \
            --body "Versions the current Unreleased changelog section for ${RELEASE_VERSION}. Merging this pull request automatically creates the tag and GitHub release, adds the changelog to the release description, and starts the Docker release build.")

          gh workflow run changelog-guard.yml --ref "${branch}"
          echo "Release pull request: ${pr_url}" >> "${GITHUB_STEP_SUMMARY}"

  publish:
    name: Publish merged release
    if: >-
      ${{
        github.event_name == 'pull_request' &&
        github.event.pull_request.merged == true &&
        github.event.pull_request.user.login == 'github-actions[bot]' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        startsWith(github.event.pull_request.head.ref, 'release/prepare-v')
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
      contents: write
      pull-requests: read
    steps:
      - name: Verify release pull request scope
        env:
          GH_TOKEN: ${{ github.token }}
          PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          mapfile -t changed_files < <(
            gh api --paginate \
              "repos/${GITHUB_REPOSITORY}/pulls/${PULL_REQUEST_NUMBER}/files" \
              --jq '.[].filename'
          )
          if [ "${#changed_files[@]}" -ne 1 ] || [ "${changed_files[0]}" != "CHANGELOG.md" ]; then
            echo "::error title=CHLOG-PUBLISH-VALIDATESCOPE::Release pull request must change only CHANGELOG.md."
            printf 'Changed file: %s\n' "${changed_files[@]}"
            exit 1
          fi

      - name: Checkout merged release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: true

      - name: Validate and render release notes
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          release_version="${HEAD_BRANCH#release/prepare-}"
          go run ./cmd/changelogrelease extract \
            --version "${release_version}" \
            --changelog CHANGELOG.md \
            --output release-notes.md
          go run ./cmd/changelogrelease compose \
            --body /dev/null \
            --changelog release-notes.md \
            --output release-body.md
          echo "RELEASE_VERSION=${release_version}" >> "${GITHUB_ENV}"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin "refs/tags/${RELEASE_VERSION}" >/dev/null 2>&1; then
            git fetch --force origin \
              "refs/tags/${RELEASE_VERSION}:refs/tags/${RELEASE_VERSION}"
            tag_commit=$(git rev-list --max-count=1 "${RELEASE_VERSION}")
            if [ "${tag_commit}" != "${RELEASE_COMMIT}" ]; then
              echo "::error title=CHLOG-PUBLISH-VALIDATETAG::Tag ${RELEASE_VERSION} points to ${tag_commit}, expected ${RELEASE_COMMIT}."
              exit 1
            fi
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag --annotate \
              --message "Release ${RELEASE_VERSION}" \
              "${RELEASE_VERSION}" \
              "${RELEASE_COMMIT}"
            git push origin "refs/tags/${RELEASE_VERSION}"
          fi

          if gh release view "${RELEASE_VERSION}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "GitHub release ${RELEASE_VERSION} already exists; keeping it unchanged."
          else
            release_arguments=(
              "${RELEASE_VERSION}"
              --repo "${GITHUB_REPOSITORY}"
              --title "${RELEASE_VERSION}"
              --notes-file release-body.md
              --verify-tag
            )
            if [[ "${RELEASE_VERSION}" == *-* ]]; then
              release_arguments+=(--prerelease)
            fi
            gh release create "${release_arguments[@]}"
          fi

      - name: Start release workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run docker-release.yml \
            --repo "${GITHUB_REPOSITORY}" \
            --ref "${RELEASE_VERSION}" \
            --field "release_tag=${RELEASE_VERSION}"
          gh workflow run vuln-scan.yml \
            --repo "${GITHUB_REPOSITORY}" \
            --ref "${RELEASE_VERSION}"
          echo "Published ${RELEASE_VERSION} and started its Docker release build and vulnerability scan." >> "${GITHUB_STEP_SUMMARY}"
