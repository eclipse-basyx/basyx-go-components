name: Docker Release Build

on:
  workflow_call:
    inputs:
      release_tag:
        description: Existing draft release tag
        required: true
        type: string
    secrets:
      DOCKER_HUB_USER:
        required: true
      DOCKER_HUB_TOKEN:
        required: true

permissions: {}

jobs:
  guard:
    if: ${{ github.repository == 'eclipse-basyx/basyx-go-components' }}
    runs-on: ubuntu-latest
    permissions:
      # GitHub only exposes draft releases to tokens with push access.
      contents: write
    outputs:
      should-run: ${{ steps.check.outputs.should-run }}
      release-tag: ${{ steps.check.outputs.release-tag }}
      release-commit: ${{ steps.check.outputs.release-commit }}
      commit-date: ${{ steps.check.outputs.commit-date }}
      prerelease: ${{ steps.check.outputs.prerelease }}
      published: ${{ steps.check.outputs.published }}
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_tag }}
          fetch-depth: 0

      - name: Install Changie
        run: bash .github/scripts/install-changie.sh

      - id: check
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          release_tag="${INPUT_RELEASE_TAG}"
          if [ -z "${release_tag}" ]; then
            echo "::error title=RELEASE-GUARD-RESOLVETAG::Release tag is missing."
            exit 1
          fi
          git fetch --force origin \
            "+refs/heads/${DEFAULT_BRANCH}:refs/remotes/origin/${DEFAULT_BRANCH}" \
            "+refs/tags/*:refs/tags/*"
          release_commit=$(git rev-list --max-count=1 "${release_tag}")
          if ! git merge-base --is-ancestor "${release_commit}" "origin/${DEFAULT_BRANCH}"; then
            echo "::error title=RELEASE-GUARD-VALIDATEBRANCH::Tag ${release_tag} is not reachable from ${DEFAULT_BRANCH}."
            exit 1
          fi

          release_json=$(gh release view "${release_tag}" \
            --repo "${GITHUB_REPOSITORY}" \
            --json isDraft,isPrerelease)
          is_draft=$(jq -r '.isDraft' <<< "${release_json}")
          is_prerelease=$(jq -r '.isPrerelease' <<< "${release_json}")
          expected_prerelease=false
          if [[ "${release_tag}" == *-* ]]; then
            expected_prerelease=true
          fi
          if [ "${is_prerelease}" != "${expected_prerelease}" ]; then
            echo "::error title=RELEASE-GUARD-VALIDATETYPE::Release prerelease state does not match tag ${release_tag}."
            exit 1
          fi

          version_file=".changes/${release_tag}.md"
          if [ ! -f "${version_file}" ]; then
            echo "::error title=RELEASE-GUARD-VALIDATECHANGELOG::${version_file} is missing from the release tag."
            exit 1
          fi
          if [ "${is_draft}" = "true" ]; then
            version_check=$(mktemp -d)
            mkdir -p "${version_check}/.changes/unreleased"
            {
              echo 'changesDir: .changes'
              echo 'unreleasedDir: unreleased'
              echo 'changelogPath: CHANGELOG.md'
              echo 'versionExt: md'
            } > "${version_check}/.changie.yaml"
            : > "${version_check}/CHANGELOG.md"
            while IFS= read -r tag; do
              if [[ "${tag}" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
                if [ "${is_prerelease}" = "true" ] || [[ "${tag}" != *-* ]]; then
                  : > "${version_check}/.changes/${tag}.md"
                fi
              fi
            done < <(git tag --list)
            newest_tag=$(cd "${version_check}" && changie latest)
            if [ "${newest_tag}" != "${release_tag}" ]; then
              echo "::error title=RELEASE-GUARD-COMPAREVERSION::${release_tag} is older than repository release tag ${newest_tag}."
              exit 1
            fi
          fi

          published=true
          if [ "${is_draft}" = "true" ]; then
            published=false
          fi
          echo "should-run=${is_draft}" >> "${GITHUB_OUTPUT}"
          echo "published=${published}" >> "${GITHUB_OUTPUT}"
          echo "release-tag=${release_tag}" >> "${GITHUB_OUTPUT}"
          echo "release-commit=${release_commit}" >> "${GITHUB_OUTPUT}"
          echo "commit-date=$(git show -s --format=%cI "${release_commit}")" >> "${GITHUB_OUTPUT}"
          echo "prerelease=${is_prerelease}" >> "${GITHUB_OUTPUT}"

  build-and-push:
    needs: guard
    if: ${{ needs.guard.outputs.should-run == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        service:
          - name: aasenvironmentservice
            image: eclipsebasyx/aasenvironment-go
          - name: aasregistryservice
            image: eclipsebasyx/aasregistry-go
          - name: discoveryservice
            image: eclipsebasyx/aasdiscovery-go
          - name: digitaltwinregistryservice
            image: eclipsebasyx/digitaltwinregistry-go
          - name: companylookupservice
            image: eclipsebasyx/companylookup-go
          - name: submodelrepositoryservice
            image: eclipsebasyx/submodelrepository-go
          - name: submodelregistryservice
            image: eclipsebasyx/submodelregistry-go
          - name: conceptdescriptionrepositoryservice
            image: eclipsebasyx/conceptdescriptionrepository-go
          - name: aasrepositoryservice
            image: eclipsebasyx/aasrepository-go
          - name: aasxfileserverservice
            image: eclipsebasyx/aasxfileserver-go
          - name: basyxconfigurationservice
            image: eclipsebasyx/basyxconfigurationservice-go
          - name: dppapiservice
            image: eclipsebasyx/dppapi-go

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.guard.outputs.release-tag }}
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
        with:
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ secrets.DOCKER_HUB_USER }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v2.4.1

      - name: Install Syft (verified)
        run: |
          set -euo pipefail
          SYFT_VERSION=1.29.1
          BASE_URL="https://github.com/anchore/syft/releases/download/v${SYFT_VERSION}"
          ARCHIVE="syft_${SYFT_VERSION}_linux_amd64.tar.gz"
          CHECKSUMS="syft_${SYFT_VERSION}_checksums.txt"
          CERT="${CHECKSUMS}.pem"
          SIG="${CHECKSUMS}.sig"

          curl -fsSLO "${BASE_URL}/${ARCHIVE}"
          curl -fsSLO "${BASE_URL}/${CHECKSUMS}"
          curl -fsSLO "${BASE_URL}/${CERT}"
          curl -fsSLO "${BASE_URL}/${SIG}"

          cosign verify-blob "${CHECKSUMS}" \
            --certificate "${CERT}" \
            --signature "${SIG}" \
            --certificate-identity 'https://github.com/anchore/syft/.github/workflows/release.yaml@refs/heads/main' \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com"

          grep " ${ARCHIVE}$" "${CHECKSUMS}" | sha256sum -c -
          tar -xzf "${ARCHIVE}" syft
          sudo install -m 0755 syft /usr/local/bin/syft
          syft version

      - name: Generate version tags
        id: meta
        env:
          RELEASE_COMMIT: ${{ needs.guard.outputs.release-commit }}
          RELEASE_TAG: ${{ needs.guard.outputs.release-tag }}
        run: |
          set -euo pipefail
          version=${RELEASE_TAG#v}
          if [[ ! "${version}" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
            echo "::error title=DOCKER-RELEASE-VALIDATEVERSION::Invalid Docker release version ${version}."
            exit 1
          fi
          staging_tag="${{ matrix.service.image }}:release-${RELEASE_COMMIT}"
          tags="${{ matrix.service.image }}:${version}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "staging-tag=${staging_tag}" >> "${GITHUB_OUTPUT}"
          echo "tags=${tags}" >> "${GITHUB_OUTPUT}"
          echo "Preparing ${staging_tag} for final image ${tags}."

      - name: Resolve an existing staged image
        id: existing
        env:
          COSIGN_CERT_IDENTITY: https://github.com/eclipse-basyx/basyx-go-components/.github/workflows/docker-release.yml@refs/heads/main
          STAGING_TAG: ${{ steps.meta.outputs.staging-tag }}
        run: |
          set -euo pipefail
          if digest=$(docker buildx imagetools inspect "${STAGING_TAG}" --raw 2>/dev/null | sha256sum | awk '{print "sha256:" $1}'); then
            if [[ ! "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "::error title=DOCKER-RELEASE-VALIDATESTAGE::Invalid digest ${digest} for ${STAGING_TAG}."
              exit 1
            fi
            if ! cosign verify \
              --certificate-identity "${COSIGN_CERT_IDENTITY}" \
              --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
              "${STAGING_TAG%:*}@${digest}" >/dev/null; then
              echo "Staged image ${STAGING_TAG}@${digest} is not trusted; rebuilding it from the release tag."
              echo "exists=false" >> "${GITHUB_OUTPUT}"
              exit 0
            fi
            echo "exists=true" >> "${GITHUB_OUTPUT}"
            echo "digest=${digest}" >> "${GITHUB_OUTPUT}"
            echo "Reusing staged image ${STAGING_TAG}@${digest}."
          else
            echo "exists=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Build and push Docker image
        id: build
        if: ${{ steps.existing.outputs.exists != 'true' }}
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ./cmd/${{ matrix.service.name }}/Dockerfile
          pull: true
          push: true
          tags: ${{ steps.meta.outputs.staging-tag }}
          cache-from: |
            type=gha,scope=basyx-docker-snapshot-${{ matrix.service.name }}
            type=gha,scope=basyx-docker-release-${{ matrix.service.name }}
            type=registry,ref=${{ matrix.service.image }}:buildcache
          cache-to: |
            type=gha,scope=basyx-docker-release-${{ matrix.service.name }},mode=max
            type=registry,ref=${{ matrix.service.image }}:buildcache,mode=max
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          provenance: mode=max
          sbom: true
          labels: |
            org.opencontainers.image.title=${{ matrix.service.name }}
            org.opencontainers.image.description=Eclipse BaSyx ${{ matrix.service.name }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.guard.outputs.release-commit }}
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.vendor=Eclipse BaSyx
            org.opencontainers.image.url=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.documentation=${{ github.server_url }}/${{ github.repository }}/blob/${{ needs.guard.outputs.release-tag }}/README.md
            org.opencontainers.image.created=${{ needs.guard.outputs.commit-date }}

      - name: Resolve image digest
        id: subject
        env:
          BUILT_DIGEST: ${{ steps.build.outputs.digest }}
          EXISTING_DIGEST: ${{ steps.existing.outputs.digest }}
        run: |
          set -euo pipefail
          digest=${EXISTING_DIGEST:-${BUILT_DIGEST}}
          if [[ ! "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error title=DOCKER-RELEASE-RESOLVEDIGEST::Could not resolve a valid staged image digest."
            exit 1
          fi
          echo "digest=${digest}" >> "${GITHUB_OUTPUT}"

      - name: Validate staged image identity
        env:
          IMAGE_DIGEST_REF: ${{ matrix.service.image }}@${{ steps.subject.outputs.digest }}
          RELEASE_COMMIT: ${{ needs.guard.outputs.release-commit }}
          SERVICE: ${{ matrix.service.name }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          docker buildx imagetools inspect "${IMAGE_DIGEST_REF}" \
            --format '{"images":{{ json .Image }},"provenance":{{ json .Provenance }},"sbom":{{ json .SBOM }}}' \
            > /tmp/staged-inspection.json
          jq -e \
            --arg revision "${RELEASE_COMMIT}" \
            --arg service "${SERVICE}" \
            --arg version "${VERSION}" \
            '.images | to_entries as $images |
             ($images | length) == 3 and
             all($images[];
               .value.config.Labels["org.opencontainers.image.revision"] == $revision and
               .value.config.Labels["org.opencontainers.image.title"] == $service and
               .value.config.Labels["org.opencontainers.image.version"] == $version)' \
            /tmp/staged-inspection.json >/dev/null

      - name: Sign image digest (keyless)
        env:
          IMAGE_DIGEST_REF: ${{ matrix.service.image }}@${{ steps.subject.outputs.digest }}
        run: |
          set -euo pipefail
          cosign sign --yes "${IMAGE_DIGEST_REF}"

      - name: Extract BuildKit provenance and SBOM predicates
        run: |
          set -euo pipefail
          mkdir -p predicates
          jq '
            if .provenance["linux/amd64"] then .provenance["linux/amd64"].SLSA
            else .provenance.SLSA
            end
          ' /tmp/staged-inspection.json > predicates/provenance.buildkit.json
          jq '
            if .sbom["linux/amd64"] then .sbom["linux/amd64"].SPDX
            else .sbom.SPDX
            end
          ' /tmp/staged-inspection.json > predicates/sbom.buildkit.spdx.json

          jq -e 'type == "object" and length > 0' predicates/provenance.buildkit.json >/dev/null
          jq -e 'type == "object" and length > 0' predicates/sbom.buildkit.spdx.json >/dev/null

      - name: Detect provenance predicate type
        run: |
          set -euo pipefail
          PROVENANCE_PREDICATE_TYPE=$(jq -r '
            if has("buildDefinition") and has("runDetails") then "https://slsa.dev/provenance/v1"
            elif has("builder") and has("buildType") then "https://slsa.dev/provenance/v0.2"
            else ""
            end
          ' predicates/provenance.buildkit.json)

          if [ -z "${PROVENANCE_PREDICATE_TYPE}" ]; then
            echo "Unsupported BuildKit provenance predicate shape:" >&2
            jq -r 'keys_unsorted | @json' predicates/provenance.buildkit.json >&2
            exit 1
          fi

          echo "Detected provenance predicate type: ${PROVENANCE_PREDICATE_TYPE}"
          echo "PROVENANCE_PREDICATE_TYPE=${PROVENANCE_PREDICATE_TYPE}" >> "$GITHUB_ENV"

      - name: Verify BuildKit OCI attestation manifests exist
        env:
          IMAGE_DIGEST_REF: ${{ matrix.service.image }}@${{ steps.subject.outputs.digest }}
        run: |
          set -euo pipefail
          docker buildx imagetools inspect "${IMAGE_DIGEST_REF}" --raw > /tmp/image-index.json
          jq -e '.manifests | map(select(.annotations["vnd.docker.reference.type"] == "attestation-manifest")) | length > 0' /tmp/image-index.json >/dev/null

      - name: Create Cosign attestations from BuildKit predicates
        env:
          IMAGE_DIGEST_REF: ${{ matrix.service.image }}@${{ steps.subject.outputs.digest }}
        run: |
          set -euo pipefail
          cosign attest --yes \
            --type "${PROVENANCE_PREDICATE_TYPE}" \
            --predicate predicates/provenance.buildkit.json \
            "${IMAGE_DIGEST_REF}"
          cosign attest --yes \
            --type https://spdx.dev/Document \
            --predicate predicates/sbom.buildkit.spdx.json \
            "${IMAGE_DIGEST_REF}"

      - name: Verify signature and Cosign attestations
        env:
          IMAGE_DIGEST_REF: ${{ matrix.service.image }}@${{ steps.subject.outputs.digest }}
          COSIGN_CERT_IDENTITY: https://github.com/eclipse-basyx/basyx-go-components/.github/workflows/docker-release.yml@refs/heads/main
        run: |
          set -euo pipefail
          cosign verify \
            --certificate-identity "${COSIGN_CERT_IDENTITY}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "${IMAGE_DIGEST_REF}"
          cosign verify-attestation \
            --type "${PROVENANCE_PREDICATE_TYPE}" \
            --certificate-identity "${COSIGN_CERT_IDENTITY}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "${IMAGE_DIGEST_REF}" > /tmp/provenance.jsonl
          test -s /tmp/provenance.jsonl
          cosign verify-attestation \
            --type "https://spdx.dev/Document" \
            --certificate-identity "${COSIGN_CERT_IDENTITY}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "${IMAGE_DIGEST_REF}" > /tmp/sbom-attestation.jsonl
          test -s /tmp/sbom-attestation.jsonl

      - name: Export SPDX and CycloneDX SBOM files
        env:
          IMAGE_DIGEST_REF: ${{ matrix.service.image }}@${{ steps.subject.outputs.digest }}
        run: |
          set -euo pipefail
          mkdir -p release-assets
          syft "${IMAGE_DIGEST_REF}" \
            -o "spdx-json=release-assets/${{ matrix.service.name }}-${{ steps.meta.outputs.version }}.spdx.json" \
            -o "cyclonedx-json=release-assets/${{ matrix.service.name }}-${{ steps.meta.outputs.version }}.cdx.json"

      - name: Write service release metadata
        run: |
          set -euo pipefail
          jq -n \
            --arg service "${{ matrix.service.name }}" \
            --arg image "${{ matrix.service.image }}" \
            --arg digest "${{ steps.subject.outputs.digest }}" \
            --arg version "${{ steps.meta.outputs.version }}" \
            --arg tags "${{ steps.meta.outputs.tags }}" \
            --arg signatureIdentity "https://github.com/eclipse-basyx/basyx-go-components/.github/workflows/docker-release.yml@refs/heads/main" \
            --arg provenancePredicateType "${PROVENANCE_PREDICATE_TYPE}" \
            --arg spdx "${{ matrix.service.name }}-${{ steps.meta.outputs.version }}.spdx.json" \
            --arg cyclonedx "${{ matrix.service.name }}-${{ steps.meta.outputs.version }}.cdx.json" \
            '{
              service: $service,
              image: $image,
              digest: $digest,
              version: $version,
              tags: ($tags | split(",")),
              signatureIdentity: $signatureIdentity,
              provenancePredicateType: $provenancePredicateType,
              sbomFiles: {
                spdxJson: $spdx,
                cyclonedxJson: $cyclonedx
              }
            }' > "release-assets/${{ matrix.service.name }}-metadata.json"

      - name: Upload per-service SBOM artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-sbom-${{ matrix.service.name }}
          path: release-assets/*
          retention-days: 30

      - name: Image digest
        run: |
          echo "Built and pushed ${{ matrix.service.image }}"
          echo "Version: ${{ steps.meta.outputs.version }}"
          echo "Tags: ${{ steps.meta.outputs.tags }}"
          echo "Digest: ${{ steps.subject.outputs.digest }}"

  finalize-release:
    needs: [guard, build-and-push]
    if: ${{ needs.guard.outputs.should-run == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.guard.outputs.release-tag }}
          fetch-depth: 0

      - name: Install Changie
        run: bash .github/scripts/install-changie.sh

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v2.4.1

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ secrets.DOCKER_HUB_USER }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Download SBOM artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-sbom-*
          merge-multiple: true
          path: release-assets

      - name: Generate release supply-chain manifest
        env:
          GENERATED_AT: ${{ needs.guard.outputs.commit-date }}
          RELEASE_TAG: ${{ needs.guard.outputs.release-tag }}
        run: |
          set -euo pipefail
          test "$(find release-assets -maxdepth 1 -name '*-metadata.json' | wc -l | tr -d ' ')" = 12
          test "$(find release-assets -maxdepth 1 -name '*.spdx.json' | wc -l | tr -d ' ')" = 12
          test "$(find release-assets -maxdepth 1 -name '*.cdx.json' | wc -l | tr -d ' ')" = 12
          jq -s \
            --arg release "${RELEASE_TAG}" \
            --arg generatedAt "${GENERATED_AT}" \
            '{
              release: $release,
              generatedAt: $generatedAt,
              services: sort_by(.service)
            }' release-assets/*-metadata.json > release-assets/release-supply-chain-manifest.json
          bash .github/scripts/validate-release-manifest.sh \
            release-assets/release-supply-chain-manifest.json \
            "${RELEASE_TAG}"

      - name: Attach assets to draft release
        id: release-state
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.guard.outputs.release-tag }}
        run: |
          set -euo pipefail
          is_draft=$(gh release view "${RELEASE_TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --json isDraft \
            --jq '.isDraft')
          if [ "${is_draft}" != "true" ]; then
            echo "Release ${RELEASE_TAG} is already published; verifying its completed state."
            echo "published=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          echo "published=false" >> "${GITHUB_OUTPUT}"
          gh release upload "${RELEASE_TAG}" release-assets/* \
            --repo "${GITHUB_REPOSITORY}" \
            --clobber

      - name: Promote and verify release image tags
        if: ${{ steps.release-state.outputs.published != 'true' }}
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          PRERELEASE: ${{ needs.guard.outputs.prerelease }}
          RELEASE_COMMIT: ${{ needs.guard.outputs.release-commit }}
          RELEASE_TAG: ${{ needs.guard.outputs.release-tag }}
        run: |
          set -euo pipefail
          version=${RELEASE_TAG#v}

          resolve_registry_digest() {
            local reference=$1
            local manifest_file
            manifest_file=$(mktemp)
            local attempt
            for attempt in 1 2 3; do
              if docker buildx imagetools inspect "${reference}" --raw > "${manifest_file}"; then
                printf 'sha256:%s\n' "$(sha256sum "${manifest_file}" | cut -d ' ' -f 1)"
                return 0
              fi
              if [ "${attempt}" -lt 3 ]; then
                sleep $((attempt * 5))
              fi
            done
            echo "::error title=DOCKER-RELEASE-RESOLVEDIGEST::Unable to resolve ${reference}." >&2
            return 1
          }

          images=(
            eclipsebasyx/aasenvironment-go
            eclipsebasyx/aasregistry-go
            eclipsebasyx/aasdiscovery-go
            eclipsebasyx/digitaltwinregistry-go
            eclipsebasyx/companylookup-go
            eclipsebasyx/submodelrepository-go
            eclipsebasyx/submodelregistry-go
            eclipsebasyx/conceptdescriptionrepository-go
            eclipsebasyx/aasrepository-go
            eclipsebasyx/aasxfileserver-go
            eclipsebasyx/basyxconfigurationservice-go
            eclipsebasyx/dppapi-go
          )

          validate_release_order() {
            git fetch --force origin \
              "+refs/heads/${DEFAULT_BRANCH}:refs/remotes/origin/${DEFAULT_BRANCH}" \
              "+refs/tags/*:refs/tags/*"
            if ! git merge-base --is-ancestor "${RELEASE_COMMIT}" "origin/${DEFAULT_BRANCH}"; then
              echo "::error title=DOCKER-RELEASE-VALIDATEBRANCH::Release commit is no longer reachable from ${DEFAULT_BRANCH}."
              return 1
            fi

            local version_check
            version_check=$(mktemp -d)
            mkdir -p "${version_check}/.changes/unreleased"
            {
              echo 'changesDir: .changes'
              echo 'unreleasedDir: unreleased'
              echo 'changelogPath: CHANGELOG.md'
              echo 'versionExt: md'
            } > "${version_check}/.changie.yaml"
            : > "${version_check}/CHANGELOG.md"
            while IFS= read -r tag; do
              if [[ "${tag}" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
                if [ "${PRERELEASE}" = "true" ] || [[ "${tag}" != *-* ]]; then
                  : > "${version_check}/.changes/${tag}.md"
                fi
              fi
            done < <(git tag --list)
            local newest_tag
            newest_tag=$(cd "${version_check}" && changie latest)
            rm -rf "${version_check}"
            if [ "${newest_tag}" != "${RELEASE_TAG}" ]; then
              echo "::error title=DOCKER-RELEASE-COMPAREVERSION::${RELEASE_TAG} is older than repository release tag ${newest_tag}."
              return 1
            fi
          }

          validate_release_order
          for image in "${images[@]}"; do
            expected_digest=$(jq -r --arg image "${image}" '.services[] | select(.image == $image) | .digest' release-assets/release-supply-chain-manifest.json)
            staging_ref="${image}:release-${RELEASE_COMMIT}"
            staging_digest=$(resolve_registry_digest "${staging_ref}")
            if [ "${staging_digest}" != "${expected_digest}" ]; then
              echo "::error title=DOCKER-RELEASE-VALIDATESTAGE::${staging_ref} no longer matches its recorded digest."
              exit 1
            fi
            docker buildx imagetools create --tag "${image}:${version}" "${image}@${staging_digest}"
          done

          if [ "${PRERELEASE}" != "true" ]; then
            if [[ ! "${version}" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
              echo "::error title=DOCKER-RELEASE-PROMOTEVERSION::Invalid stable release version ${version}."
              exit 1
            fi
            major=${BASH_REMATCH[1]}
            minor=${BASH_REMATCH[2]}
            for image in "${images[@]}"; do
              expected_digest=$(jq -r --arg image "${image}" '.services[] | select(.image == $image) | .digest' release-assets/release-supply-chain-manifest.json)
              docker buildx imagetools create \
                --tag "${image}:${major}.${minor}" \
                --tag "${image}:${major}" \
                --tag "${image}:latest" \
                "${image}@${expected_digest}"
            done
          fi

          for image in "${images[@]}"; do
            expected_digest=$(jq -r --arg image "${image}" '.services[] | select(.image == $image) | .digest' release-assets/release-supply-chain-manifest.json)
            final_digest=$(resolve_registry_digest "${image}:${version}")
            if [ "${final_digest}" != "${expected_digest}" ]; then
              echo "::error title=DOCKER-RELEASE-VERIFYTAG::${image}:${version} does not match its recorded digest."
              exit 1
            fi
            if [ "${PRERELEASE}" != "true" ]; then
              for alias in "${major}.${minor}" "${major}" latest; do
                alias_digest=$(resolve_registry_digest "${image}:${alias}")
                if [ "${alias_digest}" != "${expected_digest}" ]; then
                  echo "::error title=DOCKER-RELEASE-VERIFYALIAS::${image}:${alias} does not match ${image}:${version}."
                  exit 1
                fi
              done
            fi
          done
          validate_release_order

      - name: Publish completed release
        if: ${{ steps.release-state.outputs.published != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ needs.guard.outputs.prerelease }}
          RELEASE_TAG: ${{ needs.guard.outputs.release-tag }}
        run: |
          set -euo pipefail
          if [ "${PRERELEASE}" = "true" ]; then
            gh release edit "${RELEASE_TAG}" \
              --repo "${GITHUB_REPOSITORY}" \
              --draft=false \
              --prerelease \
              --latest=false
          else
            gh release edit "${RELEASE_TAG}" \
              --repo "${GITHUB_REPOSITORY}" \
              --draft=false \
              --prerelease=false \
              --latest
          fi
          gh release view "${RELEASE_TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --json isDraft \
            --jq 'select(.isDraft == false)' >/dev/null

      - name: Verify completed release
        env:
          COSIGN_CERT_IDENTITY: https://github.com/eclipse-basyx/basyx-go-components/.github/workflows/docker-release.yml@refs/heads/main
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ needs.guard.outputs.prerelease }}
          RELEASE_TAG: ${{ needs.guard.outputs.release-tag }}
        run: |
          set -euo pipefail

          resolve_registry_digest() {
            local reference=$1
            local manifest_file
            manifest_file=$(mktemp)
            local attempt
            for attempt in 1 2 3; do
              if docker buildx imagetools inspect "${reference}" --raw > "${manifest_file}"; then
                printf 'sha256:%s\n' "$(sha256sum "${manifest_file}" | cut -d ' ' -f 1)"
                return 0
              fi
              if [ "${attempt}" -lt 3 ]; then
                sleep $((attempt * 5))
              fi
            done
            echo "::error title=DOCKER-RELEASE-RESOLVEDIGEST::Unable to resolve ${reference}." >&2
            return 1
          }

          release_json=$(gh release view "${RELEASE_TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --json assets,isDraft)
          if [ "$(jq -r '.isDraft' <<< "${release_json}")" != "false" ]; then
            echo "::error title=DOCKER-RELEASE-VERIFYRELEASE::Release ${RELEASE_TAG} is still a draft."
            exit 1
          fi
          asset_names=$(jq -r '.assets[].name' <<< "${release_json}")
          while IFS= read -r expected_asset; do
            if ! grep -Fqx "${expected_asset}" <<< "${asset_names}"; then
              echo "::error title=DOCKER-RELEASE-VERIFYASSET::Published release is missing ${expected_asset}."
              exit 1
            fi
          done < <(jq -r '
            .services[] |
            (.service + "-metadata.json"),
            .sbomFiles.spdxJson,
            .sbomFiles.cyclonedxJson
          ' release-assets/release-supply-chain-manifest.json)

          version=${RELEASE_TAG#v}
          if [ "${PRERELEASE}" != "true" ]; then
            if [[ ! "${version}" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
              echo "::error title=DOCKER-RELEASE-VERIFYVERSION::Invalid stable release version ${version}."
              exit 1
            fi
            major=${BASH_REMATCH[1]}
            minor=${BASH_REMATCH[2]}
          fi
          bash .github/scripts/validate-release-manifest.sh \
            release-assets/release-supply-chain-manifest.json \
            "${RELEASE_TAG}"
          while IFS=$'\t' read -r image expected_digest predicate_type; do
            image_digest_ref="${image}@${expected_digest}"
            actual_digest=$(resolve_registry_digest "${image}:${version}")
            if [ "${actual_digest}" != "${expected_digest}" ]; then
              echo "::error title=DOCKER-RELEASE-VERIFYIMAGE::${image}:${version} does not match the release manifest."
              exit 1
            fi
            if [ "${PRERELEASE}" != "true" ]; then
              for alias in "${major}.${minor}" "${major}" latest; do
                alias_digest=$(resolve_registry_digest "${image}:${alias}")
                if [ "${alias_digest}" != "${expected_digest}" ]; then
                  echo "::error title=DOCKER-RELEASE-VERIFYALIAS::${image}:${alias} does not match ${image}:${version}."
                  exit 1
                fi
              done
            fi
            cosign verify \
              --certificate-identity "${COSIGN_CERT_IDENTITY}" \
              --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
              "${image_digest_ref}" >/dev/null
            cosign verify-attestation \
              --type "${predicate_type}" \
              --certificate-identity "${COSIGN_CERT_IDENTITY}" \
              --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
              "${image_digest_ref}" >/dev/null
            cosign verify-attestation \
              --type https://spdx.dev/Document \
              --certificate-identity "${COSIGN_CERT_IDENTITY}" \
              --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
              "${image_digest_ref}" >/dev/null
          done < <(jq -r '.services[] | [.image, .digest, .provenancePredicateType] | @tsv' release-assets/release-supply-chain-manifest.json)

  verify-published-release:
    needs: guard
    if: ${{ needs.guard.outputs.published == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.guard.outputs.release-tag }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v2.4.1

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ secrets.DOCKER_HUB_USER }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Verify published release assets and images
        env:
          COSIGN_CERT_IDENTITY: https://github.com/eclipse-basyx/basyx-go-components/.github/workflows/docker-release.yml@refs/heads/main
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ needs.guard.outputs.prerelease }}
          RELEASE_COMMIT: ${{ needs.guard.outputs.release-commit }}
          RELEASE_TAG: ${{ needs.guard.outputs.release-tag }}
        run: |
          set -euo pipefail

          resolve_registry_digest() {
            local reference=$1
            local manifest_file
            manifest_file=$(mktemp)
            local attempt
            for attempt in 1 2 3; do
              if docker buildx imagetools inspect "${reference}" --raw > "${manifest_file}"; then
                printf 'sha256:%s\n' "$(sha256sum "${manifest_file}" | cut -d ' ' -f 1)"
                return 0
              fi
              if [ "${attempt}" -lt 3 ]; then
                sleep $((attempt * 5))
              fi
            done
            echo "::error title=DOCKER-RELEASE-RESOLVEDIGEST::Unable to resolve ${reference}." >&2
            return 1
          }

          temporary_directory=$(mktemp -d)
          gh release download "${RELEASE_TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --pattern release-supply-chain-manifest.json \
            --dir "${temporary_directory}"
          manifest="${temporary_directory}/release-supply-chain-manifest.json"
          bash .github/scripts/validate-release-manifest.sh "${manifest}" "${RELEASE_TAG}"
          asset_names=$(gh release view "${RELEASE_TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --json assets \
            --jq '.assets[].name')
          while IFS= read -r expected_asset; do
            if ! grep -Fqx "${expected_asset}" <<< "${asset_names}"; then
              echo "::error title=DOCKER-RELEASE-VERIFYASSET::Published release is missing ${expected_asset}."
              exit 1
            fi
          done < <(jq -r '
            .services[] |
            (.service + "-metadata.json"),
            .sbomFiles.spdxJson,
            .sbomFiles.cyclonedxJson
          ' "${manifest}")
          version=${RELEASE_TAG#v}
          if [ "${PRERELEASE}" != "true" ]; then
            if [[ ! "${version}" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
              echo "::error title=DOCKER-RELEASE-VERIFYVERSION::Invalid stable release version ${version}."
              exit 1
            fi
            major=${BASH_REMATCH[1]}
            minor=${BASH_REMATCH[2]}
          fi
          while IFS=$'\t' read -r service image expected_digest predicate_type; do
            actual_digest=$(resolve_registry_digest "${image}:${version}")
            if [ "${actual_digest}" != "${expected_digest}" ]; then
              echo "::error title=DOCKER-RELEASE-VERIFYPUBLISHED::${image}:${version} does not match the published manifest."
              exit 1
            fi
            if [ "${PRERELEASE}" != "true" ]; then
              for alias in "${major}.${minor}" "${major}" latest; do
                alias_digest=$(resolve_registry_digest "${image}:${alias}")
                if [ "${alias_digest}" != "${expected_digest}" ]; then
                  echo "::error title=DOCKER-RELEASE-VERIFYALIAS::${image}:${alias} does not match ${image}:${version}."
                  exit 1
                fi
              done
            fi
            image_digest_ref="${image}@${expected_digest}"
            docker buildx imagetools inspect "${image_digest_ref}" --format '{{ json .Image }}' > /tmp/published-images.json
            jq -e \
              --arg revision "${RELEASE_COMMIT}" \
              --arg service "${service}" \
              --arg version "${version}" \
              'to_entries as $images |
               ($images | length) == 3 and
               all($images[];
                 .value.config.Labels["org.opencontainers.image.revision"] == $revision and
                 .value.config.Labels["org.opencontainers.image.title"] == $service and
                 .value.config.Labels["org.opencontainers.image.version"] == $version)' \
              /tmp/published-images.json >/dev/null
            cosign verify \
              --certificate-identity "${COSIGN_CERT_IDENTITY}" \
              --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
              "${image_digest_ref}" >/dev/null
            cosign verify-attestation \
              --type "${predicate_type}" \
              --certificate-identity "${COSIGN_CERT_IDENTITY}" \
              --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
              "${image_digest_ref}" >/dev/null
            cosign verify-attestation \
              --type https://spdx.dev/Document \
              --certificate-identity "${COSIGN_CERT_IDENTITY}" \
              --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
              "${image_digest_ref}" >/dev/null
          done < <(jq -r '.services[] | [.service, .image, .digest, .provenancePredicateType] | @tsv' "${manifest}")
