x-database-environment: &database-environment
  POSTGRES_HOST: db
  POSTGRES_PORT: "5432"
  POSTGRES_USER: admin
  POSTGRES_PASSWORD: admin123
  POSTGRES_DBNAME: basyxTestDB
  POSTGRES_MAXOPENCONNECTIONS: "50"
  POSTGRES_MAXIDLECONNECTIONS: "25"
  POSTGRES_CONNMAXLIFETIMEMINUTES: "5"
  POSTGRES_CONNMAXIDLETIMEMINUTES: "0"

services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: basyxTestDB
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d basyxTestDB"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  basyx_configuration:
    image: eclipsebasyx/basyxconfigurationservice-go:SNAPSHOT
    pull_policy: always
    environment: *database-environment
    depends_on:
      db:
        condition: service_healthy

  aas-environment:
    image: eclipsebasyx/aasenvironment-go:SNAPSHOT
    pull_policy: always
    ports:
      - "8082:8082"
    environment:
      <<: *database-environment
      SERVER_PORT: "8082"
      ABAC_ENABLED: "false"
      BASYX_EVENTING_FEED_ENABLED: "true"
      GENERAL_EXTERNALURL: http://localhost:8082
      GENERAL_AASREGISTRYINTEGRATION: "true"
      GENERAL_SUBMODELREGISTRYINTEGRATION: "true"
      GENERAL_DISCOVERYINTEGRATION: "true"
      GENERAL_AAS_PRECONFIG_PATHS: /app/preconfiguration
      CORS_ALLOWEDORIGINS: "*"
      CORS_ALLOWEDHEADERS: "*"
      CORS_ALLOWCREDENTIALS: "true"
      CORS_ALLOWEDMETHODS: GET,POST,PUT,PATCH,DELETE,OPTIONS
    volumes:
      - ./aas:/app/preconfiguration:ro
    depends_on:
      basyx_configuration:
        condition: service_completed_successfully
    restart: unless-stopped

  aas-ui:
    image: eclipsebasyx/aas-gui:SNAPSHOT
    pull_policy: always
    ports:
      - "3000:3000"
    environment:
      ENDPOINT_CONFIG_AVAILABLE: "false"
    volumes:
      - ./basyx-infra.yml:/basyx-infra.yml:ro
    depends_on:
      aas-environment:
        condition: service_healthy
    restart: unless-stopped
