# Experimental relationship-based access control (ReBAC) with OpenFGA.
# BaSyx keeps the desired authorization state in its own database; OpenFGA
# runs as a separate service with its own database and user and is not
# published on the host.
services:
  aas-environment:
    container_name: rebac-aas-environment
    image: eclipsebasyx/aasenvironment-go:SNAPSHOT
    pull_policy: always
    command: ["/app/aasenvironmentservice"]
    ports:
      - "8082:8082"
    environment:
      - SERVER_PORT=8082
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=admin123
      - POSTGRES_DBNAME=basyxTestDB
      - ABAC_ENABLED=true
      - ABAC_MODELPATH=/security_env/access-rules.json
      - OIDC_TRUSTLISTPATH=/security_env/trustlist.json
      - REBAC_ENABLED=true
      - REBAC_SCOPE=example
      - REBAC_OPENFGA_API_URL=http://openfga:8080
      - REBAC_OPENFGA_CREDENTIALS_METHOD=apiToken
      - REBAC_OPENFGA_CREDENTIALS_API_TOKEN=basyx-example-openfga-key
      - REBAC_ADMINISTRATORS=http://keycloak.localhost:8080/realms/basyx|group:operators
      - GENERAL_EXTERNALURL=http://localhost:8082
    volumes:
      - ./security_env:/security_env:ro
    extra_hosts:
      - "keycloak.localhost:host-gateway"
    depends_on:
      basyx_configuration:
        condition: service_completed_successfully
      keycloak-healthcheck:
        condition: service_completed_successfully
      openfga:
        condition: service_healthy
    restart: unless-stopped

  basyx_configuration:
    container_name: rebac-basyx-configuration
    image: eclipsebasyx/basyxconfigurationservice-go:SNAPSHOT
    pull_policy: always
    environment:
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=admin123
      - POSTGRES_DBNAME=basyxTestDB
      - REBAC_SCOPE=example
      - REBAC_PROVISION_MODEL=true
      - REBAC_OPENFGA_API_URL=http://openfga:8080
      - REBAC_OPENFGA_CREDENTIALS_METHOD=apiToken
      - REBAC_OPENFGA_CREDENTIALS_API_TOKEN=basyx-example-openfga-key
    depends_on:
      db:
        condition: service_healthy
      openfga:
        condition: service_healthy

  openfga-migrate:
    container_name: rebac-openfga-migrate
    image: openfga/openfga:v1.18.1
    command: ["migrate"]
    environment:
      OPENFGA_DATASTORE_ENGINE: postgres
      OPENFGA_DATASTORE_URI: postgres://openfga:openfga@db:5432/openfga?sslmode=disable
    depends_on:
      db:
        condition: service_healthy

  openfga:
    container_name: rebac-openfga
    image: openfga/openfga:v1.18.1
    command: ["run"]
    environment:
      OPENFGA_DATASTORE_ENGINE: postgres
      OPENFGA_DATASTORE_URI: postgres://openfga:openfga@db:5432/openfga?sslmode=disable
      OPENFGA_AUTHN_METHOD: preshared
      OPENFGA_AUTHN_PRESHARED_KEYS: basyx-example-openfga-key
      OPENFGA_PLAYGROUND_ENABLED: "false"
      OPENFGA_LOG_FORMAT: json
      OPENFGA_LIST_OBJECTS_MAX_RESULTS: "1000"
    healthcheck:
      test: ["CMD", "/usr/local/bin/grpc_health_probe", "-addr=openfga:8081"]
      interval: 5s
      timeout: 5s
      retries: 20
    depends_on:
      openfga-migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  keycloak:
    container_name: rebac-keycloak
    image: keycloak/keycloak:26.0.6
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://db:5432/basyxTestDB
      KC_DB_USERNAME: admin
      KC_DB_PASSWORD: admin123
      KC_HOSTNAME: keycloak.localhost
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HTTP_ENABLED: "true"
      KC_HTTPS_ENABLED: "false"
      KC_HEALTH_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_BACKCHANNEL: "false"
      KC_IMPORT: /opt/keycloak/data/import/
      KC_HTTP_MANAGEMENT_ENABLED: "true"
    command: ["start-dev", "--import-realm", "--health-enabled=true"]
    ports:
      - "8080:8080"
    volumes:
      - ./keycloak/realm:/opt/keycloak/data/import:ro
    depends_on:
      db:
        condition: service_healthy

  keycloak-healthcheck:
    container_name: rebac-keycloak-healthcheck
    image: curlimages/curl:latest
    command: >
      sh -c "
        until curl -sf http://keycloak:9000/health/ready; do
          sleep 5;
        done"
    depends_on:
      - keycloak

  db:
    container_name: rebac-postgres
    image: postgres:18
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: basyxTestDB
    command: ["postgres", "-c", "listen_addresses=*"]
    volumes:
      - ./postgres/init-openfga.sql:/docker-entrypoint-initdb.d/init-openfga.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d basyxTestDB && pg_isready -U openfga -d openfga"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
