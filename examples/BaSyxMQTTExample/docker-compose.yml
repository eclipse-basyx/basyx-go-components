x-database: &database
  POSTGRES_HOST: db
  POSTGRES_PORT: "5432"
  POSTGRES_USER: admin
  POSTGRES_PASSWORD: admin123
  POSTGRES_DBNAME: basyx

services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: basyx
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d basyx"]
      interval: 2s
      timeout: 5s
      retries: 20
  basyx_configuration:
    image: eclipsebasyx/basyxconfigurationservice-go:SNAPSHOT
    environment: *database
    depends_on:
      db:
        condition: service_healthy
  aas-environment:
    image: eclipsebasyx/aasenvironment-go:SNAPSHOT
    environment:
      <<: *database
      SERVER_PORT: "8084"
      ABAC_ENABLED: "false"
      GENERAL_EXTERNALURL: http://localhost:8084
      BASYX_EVENTING_ENABLED: "true"
      BASYX_EVENTING_SINKS: mqtt
      BASYX_EVENTING_OUTBOX_ENABLED: "true"
      BASYX_EVENTING_MQTT_BROKER: mqtt://mqtt:1883
      BASYX_EVENTING_MQTT_CLIENT_ID: basyx-example
    ports:
      - "127.0.0.1:8084:8084"
    depends_on:
      basyx_configuration:
        condition: service_completed_successfully
  mqtt:
    image: eclipse-mosquitto:2.0.22
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    ports:
      - "127.0.0.1:1883:1883"
