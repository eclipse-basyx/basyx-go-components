security:
  authorizationMode: resource-bound-first
rebac:
  policyScope: bridges
  modelPath: /security/resource-policies.json
  bootstrapOwner:
    issuer: https://issuer.example
    subject: bridge-owner
oidc:
  trustlistPath: /security/trustlist.json
abac:
  enabled: true
  modelPath: /security/fallback.json
  policyFileImport: if_missing
server:
  port: 8080
  strictVerification: off
swagger:
  enabled: true
postgres:
  host: db
  port: 5432
  user: basyx
  password: local-example
  dbname: basyx
  sslmode: disable
