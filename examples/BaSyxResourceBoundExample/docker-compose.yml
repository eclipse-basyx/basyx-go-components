services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: basyx
      POSTGRES_PASSWORD: local-example
      POSTGRES_DB: basyx
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U basyx -d basyx"]
      interval: 2s
      timeout: 2s
      retries: 30
  configuration:
    build:
      context: ../..
      dockerfile: cmd/basyxconfigurationservice/Dockerfile
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_USER: basyx
      POSTGRES_PASSWORD: local-example
      POSTGRES_DBNAME: basyx
    depends_on:
      db:
        condition: service_healthy
  environment:
    build:
      context: ../..
      dockerfile: cmd/aasenvironmentservice/Dockerfile
    command: [/app/aasenvironmentservice, -config, /security/config.yaml]
    environment:
      SERVER_PORT: 8080
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - .:/security:ro
    depends_on:
      configuration:
        condition: service_completed_successfully
