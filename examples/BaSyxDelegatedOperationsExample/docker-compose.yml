services:
  aas-ui:
    container_name: delegated-operations-aas-web-ui
    image: eclipsebasyx/aas-gui:SNAPSHOT
    pull_policy: always
    ports:
      - "3000:3000"
    volumes:
      - ./basyx-infra.yml:/basyx-infra.yml:ro
    environment:
      ENDPOINT_CONFIG_AVAILABLE: "true"
    depends_on:
      data-init:
        condition: service_completed_successfully
    restart: unless-stopped

  aas_environment:
    container_name: delegated-operations-aas-environment
    image: eclipsebasyx/aasenvironment-go:SNAPSHOT
    pull_policy: always
    command: ["/app/aasenvironmentservice"]
    environment:
      - SERVER_PORT=5004
      - CORS_ALLOWEDORIGINS=*
      - CORS_ALLOWEDHEADERS=*
      - CORS_ALLOWEDCREDENTIALS=true
      - CORS_ALLOWEDMETHODS=GET,POST,PUT,PATCH,DELETE,OPTIONS
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=admin123
      - POSTGRES_DBNAME=basyxDelegationDB
      - POSTGRES_MAXOPENCONNECTIONS=50
      - POSTGRES_MAXIDLECONNECTIONS=25
      - POSTGRES_CONNMAXLIFETIMEMINUTES=5
      - POSTGRES_CONNMAXIDLETIMEMINUTES=0
      - JWS_PRIVATEKEYPATH=/app/rsa-key.pem
      - ABAC_ENABLED=false
      - GENERAL_EXTERNALURL=http://localhost:8090
      - GENERAL_AASREGISTRYINTEGRATION=true
      - GENERAL_SUBMODELREGISTRYINTEGRATION=true
      - GENERAL_DISCOVERYINTEGRATION=true
      - SMREPO_DELEGATION_TRUSTED_HOSTS=delegated-operation-service:8080,172.28.0.10:8080
    volumes:
      - ./basyx/rsa-key.pem:/app/rsa-key.pem:ro
    ports:
      - "8090:5004"
    depends_on:
      basyx_configuration:
        condition: service_completed_successfully
    restart: unless-stopped

  delegated-operation-service:
    container_name: delegated-operations-delegated-service
    build:
      context: ./delegated-operation-service
      dockerfile: Dockerfile
    environment:
      - PORT=8080
    networks:
      default:
        ipv4_address: 172.28.0.10
    ports:
      - "8099:8080"
    restart: unless-stopped

  data-init:
    container_name: delegated-operations-data-init
    image: curlimages/curl:latest
    volumes:
      - ./startup.sh:/startup.sh:ro
      - ./data:/data:ro
    entrypoint: ["/bin/sh", "/startup.sh"]
    depends_on:
      aas_environment:
        condition: service_started

  db:
    container_name: delegated-operations-postgres-db
    image: postgres:18
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: basyxDelegationDB
    command: ["postgres", "-c", "listen_addresses=*"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d basyxDelegationDB"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  basyx_configuration:
    container_name: delegated-operations-basyx-configuration
    image: eclipsebasyx/basyxconfigurationservice-go:SNAPSHOT
    pull_policy: always
    environment:
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=admin123
      - POSTGRES_DBNAME=basyxDelegationDB
      - POSTGRES_MAXOPENCONNECTIONS=50
      - POSTGRES_MAXIDLECONNECTIONS=25
      - POSTGRES_CONNMAXLIFETIMEMINUTES=5
      - POSTGRES_CONNMAXIDLETIMEMINUTES=0
    depends_on:
      db:
        condition: service_healthy

networks:
  default:
    ipam:
      config:
        - subnet: 172.28.0.0/24
