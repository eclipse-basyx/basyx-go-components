      - POSTGRES_MAXIDLECONNECTIONS=25
      - POSTGRES_CONNMAXLIFETIMEMINUTES=5
      - POSTGRES_CONNMAXIDLETIMEMINUTES=0
      - JWS_PRIVATEKEYPATH=/app/rsa-key.pem
      - ABAC_ENABLED=true
      - ABAC_MODELPATH=/security_env/access-rules.json
      - ABAC_POLICY_FILE_IMPORT=if_missing
      - EXPERIMENTAL_REBAC_AUTHORIZATION_MODE=resource-bound-first
      - EXPERIMENTAL_REBAC_POLICY_SCOPE=secured-example-resources
      - EXPERIMENTAL_REBAC_BOOTSTRAP_OWNER_ISSUER=http://keycloak.localhost:8080/realms/basyx
      - EXPERIMENTAL_REBAC_BOOTSTRAP_OWNER_SUBJECT=32103f0d-1d0e-4d94-b720-bcd22e1c7709
