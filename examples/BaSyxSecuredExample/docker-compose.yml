services:
  aas-registry:
    container_name: aas-registry
    build:
      context: ../..
      dockerfile: cmd/aasregistryservice/Dockerfile
    command: ["/app/aasregistryservice"]
    ports:
      - 8082:5004
    environment:
      - SERVER_PORT=5004
      - SERVER_VERIFICATIONENDPOINTAVAILABLE=true
      - CORS_ALLOWEDORIGINS=*
      - CORS_ALLOWEDHEADERS=*
      - CORS_ALLOWEDCREDENTIALS=true
      - CORS_ALLOWEDMETHODS=GET,POST,PUT,PATCH,DELETE,OPTIONS
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=admin123
      - POSTGRES_DBNAME=basyxTestDB
      - POSTGRES_MAXOPENCONNECTIONS=50
      - POSTGRES_MAXIDLECONNECTIONS=25
      - POSTGRES_CONNMAXLIFETIMEMINUTES=5
      - POSTGRES_CONNMAXIDLETIMEMINUTES=0
      - ABAC_ENABLED=true
      - ABAC_MODELPATH=/security_env/access-rules.json
      - ABAC_POLICY_FILE_IMPORT=if_missing
      - EXPERIMENTAL_REBAC_AUTHORIZATION_MODE=resource-bound-first
      - EXPERIMENTAL_REBAC_POLICY_SCOPE=secured-example-resources
      - EXPERIMENTAL_REBAC_BOOTSTRAP_OWNER_ISSUER=http://keycloak.localhost:8080/realms/basyx
      - EXPERIMENTAL_REBAC_BOOTSTRAP_OWNER_SUBJECT=32103f0d-1d0e-4d94-b720-bcd22e1c7709
      - OIDC_TRUSTLISTPATH=/security_env/trustlist.json
    depends_on:
      basyx_configuration:
        condition: service_completed_successfully
      keycloak-healthcheck:
        condition: service_completed_successfully
    volumes:
      - ./security_env:/security_env:ro
    extra_hosts:
      - "keycloak.localhost:host-gateway"
    restart: unless-stopped

