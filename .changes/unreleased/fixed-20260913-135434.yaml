kind: fixed
body: Align encoded API parameters and exact reference and asset filtering across registries, repositories, Discovery, DTR and AAS Environment. Accept valid padded and unpadded base64url for Tractus-X conformance and require nonempty supplied pagination parameters; standardize query and path cursors without legacy fallback. Use the standalone registry and discovery contracts in the joined AAS Environment OpenAPI, keeping DTR extensions exclusive to the DTR specification. Correct DTR asset-link schema references and Company Lookup reference, required-name, and error-response schemas; require clientTimeoutDuration only for asynchronous value-only invocation and return HTTP 400 when missing.
