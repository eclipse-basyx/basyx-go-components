kind: fixed
body: Apply and document createdFrom and updatedFrom on AAS reference listings. Shell and reference listings reject blank filters and honor inclusive timestamp bounds without truncating fractional seconds. Custom Go implementations of the AAS repository service interface must add two *AASListTimeCutoff arguments to GetAllAssetAdministrationShellsReference and use nil for omitted filters.
