    SecurityImpact: ABAC and AASQL string predicates on a temporal Property value see the submitted text for elements written or updated by this version and the returned UTC text for older rows. Policies that match the PostgreSQL text format of earlier versions, such as "2024-01-01 08:00:00+00", need to use these representations.
