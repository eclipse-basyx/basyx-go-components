kind: fixed
body: Preserve the submitted xs:time, xs:date, and xs:dateTime values for Submodel Element Properties and Range bounds, including offsets, omitted timezones, and fractional precision. Values stored by earlier versions stay readable without rewriting existing rows. Previously stored xs:dateTime values are returned in UTC with a "+00:00" offset. Offsets or sub-microsecond precision that PostgreSQL already discarded cannot be restored. The first full replacement that resubmits such a value in another form, for example with "Z" instead of "+00:00", stores the new text and counts as a change. Before enabling writes on this version, stop all older instances that can write Submodel Elements to the same database, including in deployments with ABAC disabled. Older instances can read values stored by this version. Writes through those instances can discard offsets or fractional precision.
time: 2026-11-24T13:32:44.376208+01:00
custom:
    Impact: High
    PullRequest: 917
    SecurityImpact: ABAC and AASQL string predicates on a temporal Property value see the submitted text for elements written or updated by this version and the returned UTC text for older rows. Policies that match the PostgreSQL text format of earlier versions, such as "2024-01-01 08:00:00+00", need to use these representations.
