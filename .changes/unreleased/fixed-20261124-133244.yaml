kind: fixed
body: Preserve the submitted xs:time, xs:date, and xs:dateTime values for Submodel Element Properties and Range bounds, including offsets, omitted timezones, and fractional precision. Schema v1.2.4 backfills values from the legacy typed columns into the text columns, then removes the nine legacy Property and Range columns in the same transaction. Legacy xs:dateTime values are rendered in UTC with a "+00:00" offset. The migration preserves existing text and stops if stored representations conflict. Offsets or sub-microsecond precision that PostgreSQL already discarded cannot be restored. The first full replacement that resubmits such a value in another form, for example with "Z" instead of "+00:00", stores the new text and counts as a change. The upgrade is not compatible with rolling updates. Stop all BaSyx services sharing the database, in Kubernetes by scaling them to zero, take a restorable backup, and run the Configuration Service before starting the upgraded services. The patch holds exclusive locks on the Property and Range tables for the whole backfill, so rehearse on a copy to size the maintenance window, and views that depend on the dropped columns stop it. Rollback after a successful schema upgrade requires restoring the backup.
time: 2026-11-24T13:32:44.376208+01:00
custom:
    Impact: High
    PullRequest: 917
    SecurityImpact: ABAC and AASQL string predicates on a temporal Property value see the submitted text for elements written or updated by this version and the returned UTC text for older rows. Policies that match the PostgreSQL text format of earlier versions, such as "2024-01-01 08:00:00+00", need to use these representations. Deployments whose PostgreSQL session TimeZone was not UTC previously returned legacy xs:dateTime values with that offset and now return them in UTC.
