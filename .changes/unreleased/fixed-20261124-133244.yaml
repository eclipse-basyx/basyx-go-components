kind: fixed
body: Preserve the submitted xs:time, xs:date, and xs:dateTime values for Submodel Element Properties and Range bounds, including offsets, omitted timezones, and fractional precision. Schema v1.2.5 backfills values from the legacy typed columns into the text columns, then removes the nine legacy Property and Range columns in the same transaction. Legacy xs:dateTime values are rendered in UTC with a "+00:00" offset. The migration preserves existing text and stops if stored representations conflict. Offsets or sub-microsecond precision that PostgreSQL already discarded cannot be restored. The first full replacement that resubmits such a value in another form, for example with "Z" instead of "+00:00", stores the new text and counts as a change. Stop all BaSyx services sharing the database, take a restorable backup, and run the Configuration Service before starting the upgraded services. Rollback after a successful schema upgrade requires restoring the backup.
time: 2026-11-24T13:32:44.376208+01:00
custom:
