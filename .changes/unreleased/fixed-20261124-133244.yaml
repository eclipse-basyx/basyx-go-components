kind: fixed
body: Preserve the submitted xs:time, xs:date, and xs:dateTime values for Submodel Element Properties and Range bounds, including offsets, omitted timezones, and fractional precision. Values stored by earlier versions stay readable without a migration; previously stored xs:dateTime values are returned in UTC with a "+00:00" offset, and offsets or sub-microsecond precision that PostgreSQL already discarded cannot be restored.
