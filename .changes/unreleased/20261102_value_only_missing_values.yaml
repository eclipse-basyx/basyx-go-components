kind: fixed
body: >-
  Omit submodel elements and optional fields without a value from Value-Only
  ($value) responses of the Submodel Repository, the AAS Repository superpaths,
  and AAS Environment, instead of emitting null, empty strings, empty arrays, or
  empty objects. This applies to Submodels, collections, Entity statements,
  annotations, the submodel element listing, and Operation result arguments.
  SubmodelElementList members stay in place for index stability, and a list that
  contains Operations or Capabilities is omitted. Operation result arguments that
  are not serialized in Value-Only, such as Capabilities, are now omitted instead
  of failing the invocation. With level=core, direct child collections and lists
  are returned as {} and []. PATCH $value accepts null for a ReferenceElement so
  responses can be sent back unchanged.
