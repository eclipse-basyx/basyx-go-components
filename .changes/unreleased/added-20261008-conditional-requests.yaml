kind: added
body: 'All services support HTTP conditional requests for single resources: `GET` returns an `ETag`, `PUT`, `PATCH`, `POST` below a resource and `DELETE` accept `If-Match` and answer `412 Precondition Failed` without changing anything when it does not match, `PUT` accepts `If-None-Match: *` for create-only writes, and `GET` answers `If-None-Match` with `304 Not Modified`. Nested parts share the revision of their top-level resource, a DPP covers its shell and all its Submodels, and the AAS Environment returns the same revisions as the standalone services. The new setting `server.conditionalRequests.requireIfMatch` (default `false`) answers writes of existing resources without `If-Match` with `428 Precondition Required`. CORS always allows `If-Match` and `If-None-Match`. Revisions are stored by database schema `v1.2.3`; all services sharing a database must be stopped before the update and started in the new version, because older services do not update revisions.'
time: 2026-10-08T12:00:00.000000+02:00
custom:
    Impact: High
    PullRequest: 742
    SecurityImpact: 'Preconditions are evaluated after the not-found and authorization checks, in the same transaction as the change, so a failed precondition never reveals hidden resources and two writers with the same entity tag never both succeed. `304` is only returned after the request was authorized, and representation tags differ between callers with different views, so a changed view is never answered with `304`. The revision part of an entity tag is the same for all callers and changes when parts change that a caller cannot see. Revisions come from one database-wide sequence and therefore reveal the approximate number of writes between two reads.'
