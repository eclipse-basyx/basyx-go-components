kind: fixed
body: >-
  Return the compact JWS from GET /shells/{aasIdentifier}/$signed,
  GET /submodels/{submodelIdentifier}/$signed and
  GET /submodels/{submodelIdentifier}/$value/$signed in the AAS Repository,
