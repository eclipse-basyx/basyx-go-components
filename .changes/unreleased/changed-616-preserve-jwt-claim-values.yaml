kind: changed
body: ABAC `CLAIM` resolution no longer discards all but the first value of JWT arrays. String claims remain unchanged; numbers, booleans, arrays, and nested objects are exposed to formulas as deterministic JSON text. Policies that compare non-string claims may need to match the new complete JSON representation.
