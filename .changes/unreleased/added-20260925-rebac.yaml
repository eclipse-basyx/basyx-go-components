kind: added
body: 'Experimental relationship-based access control (ReBAC) for the AAS, Submodel and Concept Description repositories, the AAS and Submodel registries, the Digital Twin Registry, discovery, the AASX file server, the AAS Environment and the current state of Digital Product Passports. When `rebac.enabled` is set, access is granted when ABAC or ReBAC allows it. Creators own new resources, and owners share Shells, Submodels, single SubmodelElement paths, Concept Descriptions, descriptors, discovery entries and AASX packages with users and groups as viewer, editor, executor or owner through `$access` sub-resources with optimistic concurrency (`If-Match`). Further features are approved AAS-to-Submodel inheritance links, invitation links, and administrator bootstrap and recovery. Descriptors synchronized from Shells and Submodels, and discovery entries created by the discovery integration, inherit the access of their source. Relationships are stored and evaluated in the BaSyx PostgreSQL database, including lists, `/serialization`, `/upload` and the registry bulk API. ReBAC is disabled by default and leaves all existing behavior unchanged. See docu/security/REBAC.md.'
time: 2026-09-25T21:00:00Z
custom:
    Impact: Low
    PullRequest: 712
    SecurityImpact: 'ReBAC is only evaluated when ABAC does not allow unconditionally; if it cannot decide, requests fail with 503 instead of falling back to ABAC-only decisions. A ReBAC grant widens only the granted resource and, by design, is not limited by ABAC fragment filters or update conditions of that resource, so administrators should keep sensitive content in separate resources. Denials without grants look exactly like ABAC denials, management routes answer 404 to non-managers, and anonymous callers stay ABAC-only. Grants are re-evaluated by every query, so revocations take effect at commit, also for queued asynchronous work. Matching identifiers never grant access; only resources created by synchronization inherit from their source. Invitation tokens are stored only as SHA-256 hashes and accepted in the request body.'
