kind: fixed
body: >-
  Send delegated operation invocations of the Submodel Repository through one
  shared HTTP connection pool instead of a new one per invocation, so
  connections to a delegation target are reused and idle connections, file
  descriptors and goroutines no longer grow with the invocation rate.
time: 2026-11-04T12:00:00+01:00
custom:
  Impact: Low
  PullRequest: 838
  SecurityImpact: >-
    None. Every new connection is still checked against
    SMREPO_DELEGATION_TRUSTED_HOSTS and pinned to a trusted resolved IP before
    dialing, and pooled connections are dropped when that allowlist changes.
