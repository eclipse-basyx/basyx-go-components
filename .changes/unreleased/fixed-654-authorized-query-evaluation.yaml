kind: fixed
body: Query conditions now evaluate fields and related resources through their effective semantic access view, including negated conditions, nested `$match`, response filters, list selectors, casts, and regular expressions. Incompatible cast values and invalid regular expressions return no match instead of aborting query execution, and Basic Discovery global asset identifier lookups use the Basic Discovery semantic field.
