kind: fixed
body: 'AAS Environment `GET /serialization` no longer builds the whole environment in memory. It serializes one AAS, Submodel or Concept Description at a time into bounded staging storage and streams the result, so memory use depends on the largest single identifiable instead of the request or database size. Before, one request could get the service OOM-killed. A JSON, XML or AASX specification larger than `general.aasxMaxPartExpandedSizeBytes` is rejected with `413`.'
time: 2026-10-15T09:30:00.000000+02:00
custom:
    Impact: Low
    PullRequest: 767
    SecurityImpact: 'Fixes a denial of service: a single `GET /serialization` request permitted by the route''s access rules could exhaust the service memory and get it killed, and concurrent requests made this worse. Memory use is now bounded and oversized serializations are rejected with `413`.'
