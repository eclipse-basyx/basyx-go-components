kind: fixed
body: $dateTimeVal and $timeVal accept every literal form of the query-language grammar, including times without seconds such as "08:00", times and date-times without a timezone, and date-times without the "T" separator or seconds. Literals with invalid components, such as "25:00" or a 15-hour offset, are rejected with HTTP 400. $dateTimeVal literals whose instant lies before year 1, such as "0000-01-01T00:00:00Z", are compared correctly instead of causing a server error in access rules.
time: 2026-11-24T19:00:00.000000+01:00
custom:
    Impact: Low
    PullRequest: 917
    SecurityImpact: Access rule files and queries that use these literal forms are now accepted instead of rejected. Rules with zone-less literals use UTC as the implicit timezone.
