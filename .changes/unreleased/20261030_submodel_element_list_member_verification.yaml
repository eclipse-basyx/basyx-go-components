kind: fixed
body: >-
  Verify writes of SubmodelElementList members against their enclosing list in the
  Submodel Repository. `PUT` and `PATCH` of a list member, `POST` of a new member
  into a list, and `PATCH` of a list are now verified before the transaction commits
  according to the configured verification mode, so strict mode rejects members
  that violate the list's `typeValueListElement`, `valueTypeListElement`, or
  `semanticIdListElement` (AASd-107, AASd-108, AASd-109) with HTTP 400 instead of
  storing an invalid list. Each member write checks only the written member against
  the list attributes, so its cost does not grow with the list size. `PATCH` of any
  submodel element now also verifies the merged result with its unchanged value,
  not only the request payload.
