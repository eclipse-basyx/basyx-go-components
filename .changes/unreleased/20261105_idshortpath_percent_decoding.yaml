kind: fixed
body: >-
  Requests on a submodel element by idShortPath in the Submodel Repository,
  the AAS Repository superpath, and AAS Environment decode the percent-encoded
  idShortPath, which AAS Part 2 requires clients to URL-encode. Previously, an
  idShortPath with an encoded character that may also appear unencoded in a
  URL path, for example %3B for ";", %3A for ":", %2F for "/", or %2E for ".",
  was used still encoded, so existing elements were answered with 404. This
  also affected the URL in the Location header of a created element.
time: 2026-11-05T12:00:00+01:00
custom:
  Impact: Low
  PullRequest: 852
  SecurityImpact: >-
    Elements are now addressed with the same decoded path that ABAC evaluates.
    An element whose idShort contains "/", which can only be stored in the off
    or permissive verification mode, is now reachable through %2F. ABAC
    matches ROUTE objects against the decoded path, in which such an idShort
    looks like additional path segments, so ROUTE rules can match such an
    element differently than intended.
