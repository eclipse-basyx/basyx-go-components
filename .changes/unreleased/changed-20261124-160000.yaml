kind: changed
body: AASQL and ABAC temporal operators follow XSD and XPath semantics and no longer depend on the PostgreSQL session TimeZone. $dateTimeCast and $timeCast accept only xs:dateTime and xs:time values, so dates, timestamps without "T" or seconds, and other formats such as "today" no longer match, and xs:date Properties are no longer cast to midnight. UTC is the implicit timezone of values without one. Times compare as instants, so "10:00:00+02:00" equals "08:00:00Z" instead of "10:00:00Z", and "24:00:00" equals "00:00:00"; casting an xs:dateTime to xs:time keeps its clock time and timezone. Fractional seconds beyond microseconds are truncated instead of rounded, $strCast of a date-time or time returns its XPath canonical text and keeps its timezone, for example "2024-01-01T00:30:00.5+02:00", and descriptor createdAt fields read as xs:dateTime text in UTC. $sme#valueType returns the declared valueType of every Property, for example xs:int instead of xs:double and xs:boolean for a Property without a value. XSD-valid values that PostgreSQL cannot represent, such as negative years, are stored and returned unchanged but never match temporal comparisons. No database schema change is required. During a rolling upgrade, instances of the previous version still use the earlier semantics and report xs:string as the valueType of temporal Properties written by this version, so do not run mixed versions behind ABAC rules with temporal conditions or valueType checks.
time: 2026-11-24T16:00:00.000000+01:00
custom:
    Impact: High
    PullRequest: 917
    SecurityImpact: Access rules with temporal conditions can decide differently and must be reviewed. Rules comparing $timeCast of LOCALNOW or CLIENTNOW with a clock time in another offset, for example "08:00:00Z", now compare instants and need the local offset, such as "08:00:00+01:00". Casting a date or other non-xs:dateTime text with $dateTimeCast yields an indeterminate comparison. $not in ABAC policy rules preserves an indeterminate temporal comparison, including for correlated Submodel Element conditions. Rules checking $sme#valueType against the previously inferred xs:double or xs:string types can match a different set of elements. Temporal decisions are independent of the configured postgres.timezone.
