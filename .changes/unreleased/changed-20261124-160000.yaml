kind: changed
body: AASQL and ABAC temporal operators follow XSD and XPath semantics and no longer depend on the PostgreSQL session TimeZone. $dateTimeCast and $timeCast accept only xs:dateTime and xs:time values, so dates, timestamps without "T" or seconds, and other formats such as "today" no longer match, and xs:date Properties are no longer cast to midnight. UTC is the implicit timezone of values without one. Times compare as instants, so "10:00:00+02:00" equals "08:00:00Z" instead of "10:00:00Z", and "24:00:00" equals "00:00:00"; casting an xs:dateTime to xs:time keeps its clock time and timezone. Fractional seconds beyond microseconds are truncated instead of rounded, $strCast of a date-time or time returns its XPath canonical text and keeps its timezone, for example "2024-01-01T00:30:00.5+02:00", and descriptor createdAt fields read as canonical xs:dateTime text in UTC with "Z". $sme#valueType returns the declared valueType of every Property, for example xs:int instead of xs:double and xs:boolean for a Property without a value. Fields compared with a date-time, time, number, boolean, or hex operand are always cast to that type, also when implicit casts are disabled, instead of failing in PostgreSQL, $numCast of a date-time, a time, or any other value that is not a number yields no match instead of comparing the original value, $hexCast of a date-time or time yields no match, and $hexCast of a field trims and upper-cases the value like a literal cast and yields no match unless it has the form 16#<hex digits>. Values with a negative or zero year are stored and returned unchanged but never match temporal casts.
time: 2026-11-24T16:00:00.000000+01:00
custom:
    Impact: High
    PullRequest: 917
    SecurityImpact: Access rules with temporal conditions can decide differently and must be reviewed. Rules comparing $timeCast of LOCALNOW or CLIENTNOW with a clock time in another offset, for example "08:00:00Z", now compare instants and need the local offset, such as "08:00:00+01:00". Casting a date or other non-xs:dateTime text with $dateTimeCast yields an indeterminate comparison. $not in ABAC policy rules preserves an indeterminate comparison, so a failed $dateTimeCast, $timeCast, $numCast, $boolCast, or $hexCast (including implicit casts), a failed date part, a $regex whose pattern PostgreSQL rejects, whether it comes from a literal, a claim, or a field, or a $match term whose claim or attribute comparison cannot be evaluated makes a negated rule deny instead of allow, including for correlated Submodel Element conditions. In caller queries, $not over such a condition on a correlated field, such as a Submodel Element value, still includes the candidate. Rules checking $sme#valueType against the previously inferred xs:double or xs:string types can match a different set of elements. Temporal decisions are independent of the configured postgres.timezone.
