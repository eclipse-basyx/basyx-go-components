kind: changed
body: AASQL and ABAC evaluate temporal values independently of the PostgreSQL session TimeZone. xs:date and xs:dateTime values without a timezone are interpreted as UTC, the time and calendar parts of date-times are extracted in UTC, and fractional seconds beyond microseconds are truncated instead of rounded. $dateTimeCast accepts only ISO 8601 dates and date-times, so other PostgreSQL input formats such as "today" or "Jan 8 2024" no longer match. $sme#valueType returns the declared valueType of every Property, for example xs:int instead of xs:double and xs:boolean for a Property without a value. XSD-valid values that PostgreSQL cannot represent, such as negative years, are stored and returned unchanged but never match temporal comparisons. No database schema change is required. During a rolling upgrade, instances of the previous version still evaluate zone-less temporal values in the configured postgres.timezone and report xs:string as the valueType of temporal Properties written by this version, so do not run mixed versions behind ABAC rules with temporal conditions or valueType checks.
time: 2026-11-24T16:00:00.000000+01:00
custom:
    Impact: Medium
    PullRequest: 917
    SecurityImpact: Temporal comparisons in access rules use UTC regardless of the configured postgres.timezone. Rules that compare zone-less temporal values, rely on non-ISO date-time input formats, or check $sme#valueType against the previously inferred xs:double or xs:string types can match a different set of elements and should be reviewed. Mixed-version deployments can decide such rules differently per instance.
