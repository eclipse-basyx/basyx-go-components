body: Apply Submodel element metadata PATCH requests as selective metadata updates. Omitted values, children, and metadata stay untouched, avoiding stale value overwrites and unnecessary blob rewrites during concurrent updates. Property and Range valueType changes still validate and convert the stored value inside the writer transaction.
