kind: fixed
body: >-
  Give the key of a SubmodelElementList item in $reference responses of the
  Submodel Repository, the AAS Repository superpaths, and AAS Environment the
  model type of the item, such as Property or SubmodelElementCollection, instead
  of SubmodelElementList, as required by AAS Part 1. Every key of the reference
  now uses the model type of the element it refers to, and the types are read
  with one query instead of loading every parent element. With ABAC, the
  $reference of a submodel element is now authorized like a read of the element
  itself: the formula applies to the element, and the parent elements must be
  visible, but no longer have to match the formula themselves.
time: 2026-11-02T16:00:00+01:00
custom:
  Impact: Medium
  PullRequest: 815
  SecurityImpact: >-
    A caller who may read a submodel element can now also get its $reference
    when a parent element does not match the ABAC formula. The reference
    reveals the model types of the parent elements, which a read of the element
    does not.
