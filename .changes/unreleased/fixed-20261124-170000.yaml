kind: fixed
body: AASQL and ABAC conditions that apply $year, $month, $dayOfMonth, or $dayOfWeek to a field are evaluated against the stored values instead of never matching. Date parts of fields and of literals both use the value's own timezone, as XSD defines them, so $year of "2024-01-01T00:30:00+02:00" is 2024 in either position.
time: 2026-11-24T17:00:00.000000+01:00
custom:
    Impact: Medium
    PullRequest: 917
    SecurityImpact: Access rules that apply a date part to a field previously never matched and could only deny access. They now match stored values and can grant access, so review such rules before upgrading.
