kind: fixed
body: >-
  A PUT that moves a File element to another idShortPath and carries the
  managed file value unchanged now keeps the stored attachment: the content
  follows the element to its new path, including renames of the File itself
  and renames of a collection above it through a full Submodel PUT.
  Previously the element lost its value and the attachment download
  answered 404.
