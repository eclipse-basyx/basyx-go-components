kind: fixed
body: Resolve DPP identifiers from DppMetadata independently of AAS identifiers, preserve the owning AAS during updates and deletion, and return metadata DPP IDs from product searches. Add a hash index for exact property-text lookup so DPP ID resolution has an indexed access path. Download attachments with missing filenames using the managed reference or file path, and return 404 when attachment bytes are absent.
