kind: changed
body: >-
  AASX import now logs the warning AASENV-UPLDSUPPL-NOSUPPLREL with the
  Submodel, idShort path, and part when a File element references a package
  part that is not related to the AAS specification as aas-suppl. Such parts,
  for example a package thumbnail reused as product image, are not imported as
  attachments (IDTA-01005); previously they were skipped without a hint.
