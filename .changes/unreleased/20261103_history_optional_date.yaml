kind: fixed
body: >-
  Return the latest version from GET /submodels/{submodelIdentifier}/$history
  and GET /shells/{aasIdentifier}/$history in the Submodel Repository, the AAS
  Repository, and AAS Environment when the optional date query parameter is
  omitted, instead of rejecting the request with 422. If the latest version is
  a deletion, the response is 404. The published OpenAPI now declares date as
  optional, as in Part 2 V3.2, and names the Submodel operation
  GetSubmodelVersionByIdAndDate with its V3.2 semantic ID instead of
  GetSubmodelByIdAndDate.
time: 2026-11-03T10:00:00+01:00
