kind: fixed
body: >-
  Return a Result with only messages from GET /bulk/result/{handleId} in the
  AAS Registry, the Submodel Registry, the Digital Twin Registry and AAS
  Environment when a bulk operation fails, as in Part 2 V3.2, instead of a body
  which also had executionState, success, processedCount, successfulCount,
  failedCount and details. Each failed request item has one Error message with
  the item's status code as code, bulk-item-<index> as correlationId and the
  item's index, identifier and reason in text. Clients that read details or the
  counters must read messages instead.
