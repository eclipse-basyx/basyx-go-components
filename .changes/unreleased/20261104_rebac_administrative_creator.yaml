kind: added
body: >-
  With ReBAC enabled, newly created shells, Submodels, concept descriptions,
  shell descriptors and Submodel descriptors (including Submodel descriptors
  created inside a shell descriptor) get administration.creator filled with
  the authenticated caller when the client sends none. This covers POST,
  upserts that create, environment uploads and bulk registration. The value
  is an ExternalReference with one GlobalReference key
  "<issuer>|<subject>", using rebac.subjectClaim. A client-provided creator
  is kept, updates never change the field, and synchronized descriptors
  mirror their shell or Submodel.
time: 2026-11-04T16:00:00+01:00
custom:
  Impact: Low
  PullRequest: 846
  SecurityImpact: >-
    The filled creator is business data and grants no access. It exposes the
    caller's issuer and rebac.subjectClaim value to everyone who can read the
    resource; choose a subject claim that contains no personal data you do
    not want to share.
