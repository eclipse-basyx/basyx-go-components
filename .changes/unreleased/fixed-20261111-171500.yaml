body: >-
  A PUT that renames a File or Operation Submodel element in the Submodel
  Repository and AAS Environment now stores the File's value and content type
  and the Operation's variables at the new idShortPath. Previously, renaming a
  File answered with 404 and renaming an Operation discarded the variables of
  the request.
