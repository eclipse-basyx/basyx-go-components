kind: fixed
body: >-
  AAS Registry and Digital Twin Registry reads of shell and submodel
  descriptors no longer fail with HTTP 500 when an ABAC FILTERLIST condition
  uses a shell-level field such as `$aasdesc#id` or `$aasdesc#idShort` on a
  nested fragment like `$aasdesc#submodelDescriptors[].semanticId.keys[]`,
  `$aasdesc#submodelDescriptors[].supplementalSemanticIds[]` or
  `$aasdesc#submodelDescriptors[].endpoints[]`, or on `$aasdesc#endpoints[]`
  while a shell field mask is active; the condition is now evaluated against
  the owning AAS descriptor.
time: 2026-11-12T12:00:00+01:00
custom:
  Impact: Low
  PullRequest: 882
  SecurityImpact: >-
    None. Affected reads failed closed with HTTP 500 and disclosed no data.
