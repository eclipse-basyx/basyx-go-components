services:
  db_it:
    image: postgres:18
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: basyxTestDB
    command: ["postgres", "-c", "listen_addresses=*"]
    ports:
      - "127.0.0.1:${BASYX_IT_DB_PORT:-6432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d basyxTestDB"]
      interval: 10s
      timeout: 5s
      retries: 5

  aasx_fileserver_it:
    build:
      context: ../../../..
      dockerfile: ./cmd/aasxfileserverservice/Dockerfile
    environment:
      - SERVER_PORT=5004
      - POSTGRES_HOST=db_it
      - POSTGRES_PORT=5432
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=admin123
      - POSTGRES_DBNAME=basyxTestDB
      - POSTGRES_READER_HOST=db_it
      - POSTGRES_READER_PORT=5432
      - POSTGRES_READER_USER=admin
      - POSTGRES_READER_PASSWORD=admin123
      - POSTGRES_READER_DBNAME=basyxTestDB
      - POSTGRES_READER_OPTIONS=-c default_transaction_read_only=on
      - POSTGRES_READER_MAXOPENCONNECTIONS=500
      - POSTGRES_READER_MAXIDLECONNECTIONS=500
      - POSTGRES_MAXOPENCONNECTIONS=500
      - POSTGRES_MAXIDLECONNECTIONS=500
      - POSTGRES_CONNMAXLIFETIMEMINUTES=5
    ports:
      - "127.0.0.1:${BASYX_IT_API_PORT:-6004}:5004"
    depends_on:
      basyx_configuration:
        condition: service_completed_successfully
      db_it:
        condition: service_healthy

  aasx_fileserver_replica_b_it:
    build:
      context: ../../../..
      dockerfile: ./cmd/aasxfileserverservice/Dockerfile
    environment:
      - SERVER_PORT=5004
      - POSTGRES_HOST=db_it
      - POSTGRES_PORT=5432
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=admin123
      - POSTGRES_DBNAME=basyxTestDB
      - POSTGRES_READER_HOST=db_it
      - POSTGRES_READER_PORT=5432
      - POSTGRES_READER_USER=admin
      - POSTGRES_READER_PASSWORD=admin123
      - POSTGRES_READER_DBNAME=basyxTestDB
      - POSTGRES_READER_OPTIONS=-c default_transaction_read_only=on
    ports:
      - "127.0.0.1:${BASYX_IT_API_B_PORT:-6005}:5004"
    depends_on:
      basyx_configuration:
        condition: service_completed_successfully

  aasx_fileserver_context_it:
    build:
      context: ../../../..
      dockerfile: ./cmd/aasxfileserverservice/Dockerfile
    environment:
      - SERVER_PORT=5004
      - SERVER_CONTEXTPATH=/external/aasx
      - POSTGRES_HOST=db_it
      - POSTGRES_PORT=5432
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=admin123
      - POSTGRES_DBNAME=basyxTestDB
    ports:
      - "127.0.0.1:${BASYX_IT_CONTEXT_API_PORT:-6006}:5004"
    depends_on:
      basyx_configuration:
        condition: service_completed_successfully

  aasx_fileserver_limited_it:
    build:
      context: ../../../..
      dockerfile: ./cmd/aasxfileserverservice/Dockerfile
    environment:
      - SERVER_PORT=5004
      - GENERAL_UPLOADMAXSIZEBYTES=1024
      - POSTGRES_HOST=db_it
      - POSTGRES_PORT=5432
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=admin123
      - POSTGRES_DBNAME=basyxTestDB
    ports:
      - "127.0.0.1:${BASYX_IT_LIMITED_API_PORT:-6009}:5004"
    depends_on:
      basyx_configuration:
        condition: service_completed_successfully

  basyx_configuration:
    build:
      context: ../../../..
      dockerfile: ./cmd/basyxconfigurationservice/Dockerfile
    environment:
      - POSTGRES_HOST=db_it
      - POSTGRES_PORT=5432
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=admin123
      - POSTGRES_DBNAME=basyxTestDB
      - POSTGRES_MAXOPENCONNECTIONS=500
      - POSTGRES_MAXIDLECONNECTIONS=500
      - POSTGRES_CONNMAXLIFETIMEMINUTES=5
    depends_on:
      db_it:
        condition: service_healthy
