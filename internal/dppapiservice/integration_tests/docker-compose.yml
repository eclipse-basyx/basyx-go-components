services:
  dpp-api:
    build:
      context: ../../..
      dockerfile: cmd/dppapiservice/Dockerfile
    command: ["/app/dppapiservice", "-config", "/config/config.json"]
    volumes:
      - ./config.json:/config/config.json:ro
    environment:
      - GENERAL_AASREGISTRYINTEGRATION=true
      - GENERAL_SUBMODELREGISTRYINTEGRATION=true
      - GENERAL_DISCOVERYINTEGRATION=true
      - GENERAL_EXTERNALURL=http://127.0.0.1:${DPP_IT_AAS_PORT:-18082}
      - POSTGRES_READER_HOST=db
      - POSTGRES_READER_PORT=5432
      - POSTGRES_READER_USER=admin
      - POSTGRES_READER_PASSWORD=admin123
      - POSTGRES_READER_DBNAME=basyxDppLifecycleIT
      - POSTGRES_READER_OPTIONS=-c default_transaction_read_only=on
      - POSTGRES_READER_MAXOPENCONNECTIONS=10
      - POSTGRES_READER_MAXIDLECONNECTIONS=5
    ports:
      - "127.0.0.1:${DPP_IT_PORT:-18080}:8080"
    depends_on:
      basyx_configuration:
        condition: service_completed_successfully

  aas-environment:
    build:
      context: ../../..
      dockerfile: cmd/aasenvironmentservice/Dockerfile
    environment:
      - SERVER_PORT=8082
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=admin123
      - POSTGRES_DBNAME=basyxDppLifecycleIT
      - GENERAL_AASREGISTRYINTEGRATION=true
      - GENERAL_SUBMODELREGISTRYINTEGRATION=true
      - GENERAL_DISCOVERYINTEGRATION=true
      - GENERAL_EXTERNALURL=http://127.0.0.1:${DPP_IT_AAS_PORT:-18082}
    ports:
      - "127.0.0.1:${DPP_IT_AAS_PORT:-18082}:8082"
    depends_on:
      basyx_configuration:
        condition: service_completed_successfully

  basyx_configuration:
    build:
      context: ../../..
      dockerfile: cmd/basyxconfigurationservice/Dockerfile
    environment:
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=admin123
      - POSTGRES_DBNAME=basyxDppLifecycleIT
      - POSTGRES_MAXOPENCONNECTIONS=10
      - POSTGRES_MAXIDLECONNECTIONS=5
      - POSTGRES_CONNMAXLIFETIMEMINUTES=5
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:18
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: basyxDppLifecycleIT
    command: ["postgres", "-c", "listen_addresses=*"]
    ports:
      - "127.0.0.1:${DPP_IT_DB_PORT:-15432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d basyxDppLifecycleIT"]
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  postgres_data:
