services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: basyxTestDB
    command: ["postgres", "-c", "listen_addresses=*", "-c", "max_connections=500"]
    ports:
      - "127.0.0.1:${BASYX_IT_DB_PORT:-6432}:5432"
    volumes:
      - ./postgres/init-openfga.sql:/docker-entrypoint-initdb.d/init-openfga.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d basyxTestDB && pg_isready -U openfga -d openfga"]
      interval: 5s
      timeout: 5s
      retries: 20

  openfga-migrate:
    image: openfga/openfga:v1.18.1
    command: ["migrate"]
    environment:
      OPENFGA_DATASTORE_ENGINE: postgres
      OPENFGA_DATASTORE_URI: postgres://openfga:openfga@db:5432/openfga?sslmode=disable
    depends_on:
      db:
        condition: service_healthy

  openfga:
    image: openfga/openfga:v1.18.1
    command: ["run"]
    environment:
      OPENFGA_DATASTORE_ENGINE: postgres
      OPENFGA_DATASTORE_URI: postgres://openfga:openfga@db:5432/openfga?sslmode=disable
      OPENFGA_PLAYGROUND_ENABLED: "false"
      OPENFGA_LOG_FORMAT: json
      OPENFGA_LIST_OBJECTS_MAX_RESULTS: "1000"
    healthcheck:
      test: ["CMD", "/usr/local/bin/grpc_health_probe", "-addr=openfga:8081"]
      interval: 5s
      timeout: 5s
      retries: 20
    depends_on:
      openfga-migrate:
        condition: service_completed_successfully

  keycloak:
    image: keycloak/keycloak:26.0.6
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://db:5432/basyxTestDB
      KC_DB_USERNAME: admin
      KC_DB_PASSWORD: admin123
      KC_HOSTNAME: localhost
      KC_HOSTNAME_PORT: "${BASYX_IT_KEYCLOAK_PORT:-8080}"
      KC_HOSTNAME_URL: "http://localhost:${BASYX_IT_KEYCLOAK_PORT:-8080}"
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HTTP_ENABLED: "true"
      KC_HTTPS_ENABLED: "false"
      KC_HEALTH_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_BACKCHANNEL: "false"
      KC_IMPORT: /opt/keycloak/data/import/
      KC_HTTP_MANAGEMENT_ENABLED: "true"
    command: ["start-dev", "--import-realm", "--health-enabled=true"]
    ports:
      - "0.0.0.0:${BASYX_IT_KEYCLOAK_PORT:-8080}:8080"
    volumes:
      - ./keycloak/realm:/opt/keycloak/data/import
    depends_on:
      db:
        condition: service_healthy

  keycloak-healthcheck:
    image: curlimages/curl:latest
    command: >
      sh -c "
        echo 'Waiting for Keycloak to become ready...';
        until curl -sf http://keycloak:9000/health/ready; do
          sleep 5;
        done;
        echo 'Keycloak is ready!'"
    depends_on:
      - keycloak

  basyx_configuration:
    build:
      context: ../../../../../..
      dockerfile: ./cmd/basyxconfigurationservice/Dockerfile
    environment:
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=admin123
      - POSTGRES_DBNAME=basyxTestDB
      - REBAC_SCOPE=it
      - REBAC_PROVISION_MODEL=true
      - REBAC_OPENFGA_API_URL=http://openfga:8080
    depends_on:
      db:
        condition: service_healthy
      openfga:
        condition: service_healthy

  submodel-repository:
    build:
      context: ../../../../../..
      dockerfile: ./cmd/submodelrepositoryservice/Dockerfile
    environment:
      - SERVER_PORT=5004
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=admin123
      - POSTGRES_DBNAME=basyxTestDB
      - POSTGRES_MAXOPENCONNECTIONS=100
      - POSTGRES_MAXIDLECONNECTIONS=20
      - POSTGRES_CONNMAXLIFETIMEMINUTES=5
      - SERVER_STRICTVERIFICATION=off
      - BASYX_HISTORY_MODE=api
      - ABAC_ENABLED=true
      - ABAC_MODELPATH=/security_env/access-rules.json
      - OIDC_TRUSTLISTPATH=/security_env/trustlist.json
      - REBAC_ENABLED=true
      - REBAC_SCOPE=it
      - REBAC_OPENFGA_API_URL=http://openfga:8080
      - REBAC_ADMINISTRATORS=http://localhost:${BASYX_IT_KEYCLOAK_PORT:-8080}/realms/basyx|group:operators
    ports:
      - "127.0.0.1:${BASYX_IT_SM_PORT:-6014}:5004"
    depends_on:
      basyx_configuration:
        condition: service_completed_successfully
      keycloak-healthcheck:
        condition: service_completed_successfully
      openfga:
        condition: service_healthy
    volumes:
      - ${BASYX_IT_SECURITY_ENV:-../security_env}:/security_env
    extra_hosts:
      - "localhost:host-gateway"

  aas-repository:
    build:
      context: ../../../../../..
      dockerfile: ./cmd/aasrepositoryservice/Dockerfile
    environment:
      - SERVER_PORT=5004
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=admin123
      - POSTGRES_DBNAME=basyxTestDB
      - POSTGRES_MAXOPENCONNECTIONS=100
      - POSTGRES_MAXIDLECONNECTIONS=20
      - POSTGRES_CONNMAXLIFETIMEMINUTES=5
      - SERVER_STRICTVERIFICATION=off
      - BASYX_HISTORY_MODE=api
      - ABAC_ENABLED=true
      - ABAC_MODELPATH=/security_env/access-rules.json
      - OIDC_TRUSTLISTPATH=/security_env/trustlist.json
      - REBAC_ENABLED=true
      - REBAC_SCOPE=it
      - REBAC_OPENFGA_API_URL=http://openfga:8080
      - REBAC_ADMINISTRATORS=http://localhost:${BASYX_IT_KEYCLOAK_PORT:-8080}/realms/basyx|group:operators
    ports:
      - "127.0.0.1:${BASYX_IT_AAS_PORT:-6015}:5004"
    depends_on:
      basyx_configuration:
        condition: service_completed_successfully
      keycloak-healthcheck:
        condition: service_completed_successfully
      openfga:
        condition: service_healthy
    volumes:
      - ${BASYX_IT_SECURITY_ENV:-../security_env}:/security_env
    extra_hosts:
      - "localhost:host-gateway"

  cd-repository:
    build:
      context: ../../../../../..
      dockerfile: ./cmd/conceptdescriptionrepositoryservice/Dockerfile
    environment:
      - SERVER_PORT=5004
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=admin123
      - POSTGRES_DBNAME=basyxTestDB
      - POSTGRES_MAXOPENCONNECTIONS=100
      - POSTGRES_MAXIDLECONNECTIONS=20
      - POSTGRES_CONNMAXLIFETIMEMINUTES=5
      - SERVER_STRICTVERIFICATION=off
      - BASYX_HISTORY_MODE=api
      - ABAC_ENABLED=true
      - ABAC_MODELPATH=/security_env/access-rules.json
      - OIDC_TRUSTLISTPATH=/security_env/trustlist.json
      - REBAC_ENABLED=true
      - REBAC_SCOPE=it
      - REBAC_OPENFGA_API_URL=http://openfga:8080
      - REBAC_ADMINISTRATORS=http://localhost:${BASYX_IT_KEYCLOAK_PORT:-8080}/realms/basyx|group:operators
    ports:
      - "127.0.0.1:${BASYX_IT_CD_PORT:-6016}:5004"
    depends_on:
      basyx_configuration:
        condition: service_completed_successfully
      keycloak-healthcheck:
        condition: service_completed_successfully
