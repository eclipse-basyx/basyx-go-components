logging:
  format: text
  level: info

server:
  port: 5004
  contextPath: ""
  host: 0.0.0.0
  strictVerification: permissive  # Values: off|permissive|strict (default: permissive)
  verificationEndpointAvailable: true
  readHeaderTimeoutSeconds: 15
  readTimeoutSeconds: 300
  writeTimeoutSeconds: 300
  idleTimeoutSeconds: 60
  shutdownTimeoutSeconds: 10

postgres:
  # Choose exactly one connection variant:
  # 1) individual fields below, or 2) dsn. Do not mix dsn with host/port/user/password/dbname/ssl settings.
  # Pool settings may be used with either variant.
  # dsn: postgres://user:password@localhost:5432/basyxTestDB?sslmode=require
  host: localhost
  port: 5432
  user: admin
  password: admin123
  dbname: basyxTestDB
  # sslmode: disable
  # sslcert: ""
  # sslkey: ""
  # sslrootcert: ""
  # connectTimeoutSeconds: 0
  # applicationName: ""
  # fallbackApplicationName: ""
  # searchPath: ""
  # options: ""
  # timezone: ""
  maxOpenConnections: 50
  maxIdleConnections: 25
  connMaxLifetimeMinutes: 5
  connMaxIdleTimeMinutes: 0
  # Optional eventually consistent reader. Omit to reuse the writer pool.
  # reader:
  #   host: postgres-reader
  #   port: 5432
  #   user: admin
  #   password: admin123
  #   dbname: basyxTestDB
  #   sslmode: require
  #   maxOpenConnections: 50
  #   maxIdleConnections: 25
  #   connMaxLifetimeMinutes: 5
  #   connMaxIdleTimeMinutes: 0

oidc:
  trustlistPath: "config/trustlist.json"

abac:
  enabled: false
  modelPath: "config/access_rules/access-rules.json"

general:
  enableImplicitCasts: false
  enableDescriptorDebug: false
  enableCustomMiddlewareHeaderInjection: false
  supportsSingularSupplementalSemanticId: true
  uploadMaxSizeBytes: 134217728
  aasxMaxPartCount: 10000
  aasxMaxOPCMetadataSizeBytes: 16777216
  aasxMaxPartExpandedSizeBytes: 134217728
  aasxMaxTotalExpandedSizeBytes: 134217728
  aasxMaxThumbnailSizeBytes: 16777216
